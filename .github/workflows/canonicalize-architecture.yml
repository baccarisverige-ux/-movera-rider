name: Canonicalize Movera Rider

on:
  push:
    branches:
      - canonical-architecture-2026
    paths:
      - tools/canonicalize.py
      - tools/normalize_legacy_imports.py
      - tools/fix_build_blockers.py
      - .github/workflows/canonicalize-architecture.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-architecture-2026
          fetch-depth: 0
      - name: Apply architecture migration
        run: python3 tools/canonicalize.py
      - name: Normalize legacy package imports
        run: python3 tools/normalize_legacy_imports.py
      - name: Wire existing Rider assets and smoke test
        run: python3 tools/fix_build_blockers.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add missing location dependencies
        run: flutter pub add geolocator geocoding
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analysis.log
      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rider-canonical-analysis
          path: analysis.log
          retention-days: 1
      - name: Stop on analyzer errors
        if: steps.analyze.outcome == 'failure'
        run: exit 1
      - name: Tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Commit validated canonical architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize Movera Rider architecture"
          git push origin canonical-architecture-2026
