name: Canonicalize Movera Rider

on:
  push:
    branches:
      - canonical-architecture-2026
    paths:
      - tools/canonicalize.py
      - .github/workflows/canonicalize-architecture.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-architecture-2026
          fetch-depth: 0
      - name: Apply architecture migration
        shell: bash
        run: |
          set -o pipefail
          python3 tools/canonicalize.py 2>&1 | tee migration.log
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rider-migration-diagnostics
          path: migration.log
          retention-days: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build web release
        run: flutter build web --release
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Commit validated canonical architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize Movera Rider architecture"
          git push origin canonical-architecture-2026
