name: Apply Home Promo Carousel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-home-promo-carousel.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extend only the existing promo carousel
        run: python3 tools/extend_home_promo_carousel.py

      - name: Commit Rider carousel update
        run: |
          if git diff --quiet -- lib/features/rider/home/home.dart; then
            echo "No Rider source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/rider/home/home.dart
          git commit -m "Extend Rider home promo carousel"
          git push origin HEAD:main
