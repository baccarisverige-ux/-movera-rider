name: QA standalone entry diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-standalone-entry-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for live base build
        env:
          TARGET_LIVE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'b586fccf4d452027c173f117586f11434ee5f7e6' }}
        run: |
          SHORT="${TARGET_LIVE_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/?qa_standalone=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              echo "LIVE_BUILD=$SHORT" >> "$GITHUB_ENV"
              echo "Testing live Pages build $SHORT"
              exit 0
            fi
            sleep 10
          done
          echo "Target deployed bundle $SHORT not found" >&2
          exit 1

      - name: Run standalone state diagnostics
        run: |
          cat > qa-standalone.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://baccarisverige-ux.github.io/-movera-rider/';
          const results = {};

          async function enableA11y(page) {
            try { await page.getByLabel('Enable accessibility').click({ timeout: 2500 }); } catch (_) {}
            await page.waitForTimeout(400);
          }

          async function waitOwner(page, expected, label, timeout = 15000) {
            await page.waitForFunction(owner => window.moveraMapOwner === owner, expected, { timeout })
              .catch(async error => {
                const actual = await page.evaluate(() => window.moveraMapOwner || 'none');
                throw new Error(`${label}: expected ${expected}, got ${actual}`, { cause: error });
              });
          }

          async function contextFor(browser) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'en-US',
              geolocation: { latitude: 59.33258, longitude: 18.0649 },
              permissions: ['geolocation'],
            });
            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'standalone', {
                configurable: true,
                get: () => true,
              });
            });
            return context;
          }

          async function openHome(page, name) {
            await page.goto(base + `?standalone_diag=${name}&v=${Date.now()}`, {
              waitUntil: 'networkidle',
              timeout: 120000,
            });
            await page.waitForTimeout(4500);
            await enableA11y(page);
          }

          async function openSelection(page, name) {
            await openHome(page, name);
            const where = page.getByText('Where to', { exact: false });
            if (await where.count()) await where.last().click();
            else await page.mouse.click(190, 708);
            await page.waitForTimeout(1200);

            let inputs = page.locator('input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible');
            let count = await inputs.count().catch(() => 0);
            if (!count) {
              await page.mouse.click(185, 274);
              await page.waitForTimeout(400);
              inputs = page.locator('input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible');
              count = await inputs.count();
            }
            if (!count) throw new Error(`${name}: destination input missing`);
            await inputs.last().pressSequentially('Stockholm Central Station', { delay: 10 });
            await page.waitForTimeout(700);

            const next = page.getByText('Next', { exact: true });
            if (await next.count()) await next.last().click();
            else await page.mouse.click(195, 804);
            await page.waitForTimeout(3500);
            await waitOwner(page, 'pickup', `${name}: pickup`);

            await page.mouse.click(195, 797);
            await page.waitForTimeout(7000);
            await waitOwner(page, 'select_ride', `${name}: selection`);
          }

          async function enterFinding(page, name) {
            await openSelection(page, name);
            const select = page.getByText('Select Movera', { exact: true });
            if (await select.count()) await select.last().click();
            else {
              await page.mouse.click(195, 808);
              await page.waitForTimeout(900);
              await page.mouse.click(195, 808);
            }
            await waitOwner(page, 'finding', `${name}: finding`, 15000);
          }

          async function walletStorage(page) {
            return page.evaluate(() => Object.fromEntries(
              Object.entries(localStorage).filter(([key]) => key.includes('movera_wallet_balance')),
            ));
          }

          function balanceFromStorage(snapshot) {
            const entries = Object.entries(snapshot);
            if (!entries.length) return 0;
            const raw = entries[0][1];
            const candidates = [raw];
            try { candidates.push(JSON.parse(raw)); } catch (_) {}
            for (const candidate of candidates) {
              const value = Number(candidate);
              if (Number.isFinite(value)) return value;
            }
            const match = String(raw).match(/-?\d+(?:\.\d+)?/);
            if (match) return Number(match[0]);
            throw new Error(`Could not parse wallet balance from ${JSON.stringify(snapshot)}`);
          }

          async function run(name, fn) {
            try {
              const value = await fn();
              results[name] = { status: 'PASS', ...value };
              console.log(`PASS ${name}`);
            } catch (error) {
              results[name] = { status: 'FAIL', error: String(error?.stack || error) };
              console.error(`FAIL ${name}:`, error);
            }
          }

          const browser = await chromium.launch({ headless: true });

          await run('cancel_standalone', async () => {
            const context = await contextFor(browser);
            const page = await context.newPage();
            await enterFinding(page, 'cancel');
            await page.screenshot({ path: 'qa-standalone-cancel-finding.png', fullPage: true });

            // Proven by the previous diagnostic screenshot: this touch opens Cancel ride?.
            await page.touchscreen.tap(36, 32);
            await page.waitForTimeout(700);
            await page.screenshot({ path: 'qa-standalone-cancel-confirm.png', fullPage: true });

            // Cancel request button in the rendered 390x844 sheet.
            await page.touchscreen.tap(195, 739);
            await page.waitForTimeout(1000);
            await page.screenshot({ path: 'qa-standalone-cancel-reason.png', fullPage: true });

            // The reason is optional. Dismissing the reason sheet still keeps the
            // already-committed cancellation by contract.
            await page.keyboard.press('Escape');
            await page.waitForTimeout(1500);
            await page.waitForFunction(
              () => !['finding', 'waiting'].includes(window.moveraMapOwner || 'none'),
              null,
              { timeout: 10000 },
            );
            const afterCancelOwner = await page.evaluate(() => window.moveraMapOwner || 'none');
            await page.screenshot({ path: 'qa-standalone-cancel-after.png', fullPage: true });

            await page.waitForTimeout(28000);
            const stableOwner = await page.evaluate(() => window.moveraMapOwner || 'none');
            if (['finding', 'waiting'].includes(stableOwner)) {
              throw new Error(`Standalone Cancel: ride resurrected after cancellation (${stableOwner})`);
            }
            await page.screenshot({ path: 'qa-standalone-cancel-stable.png', fullPage: true });
            await context.close();
            return { afterCancelOwner, stableOwner };
          });

          await run('wallet_standalone', async () => {
            const context = await contextFor(browser);
            const page = await context.newPage();
            await openHome(page, 'wallet');
            const beforeStorage = await walletStorage(page);
            const before = balanceFromStorage(beforeStorage);

            // Proven by the previous diagnostic screenshot: this opens the drawer.
            await page.touchscreen.tap(300, 88);
            await page.waitForTimeout(700);
            await page.screenshot({ path: 'qa-standalone-wallet-menu.png', fullPage: true });

            // Wallet row in the rendered drawer.
            await page.touchscreen.tap(105, 188);
            await page.waitForTimeout(1500);
            await page.screenshot({ path: 'qa-standalone-wallet-page.png', fullPage: true });

            // Add funds button in WalletHome. Default amount is kr 200.
            await page.touchscreen.tap(195, 516);
            await page.waitForTimeout(800);
            await page.screenshot({ path: 'qa-standalone-wallet-add-sheet.png', fullPage: true });

            // Card is the third funding method in the sheet.
            await page.touchscreen.tap(110, 599);
            await page.waitForTimeout(1800);
            const afterStorage = await walletStorage(page);
            const after = balanceFromStorage(afterStorage);
            if (after !== before + 200) {
              throw new Error(
                `Standalone Wallet: expected stored balance ${before + 200}, got ${after}; ` +
                `before=${JSON.stringify(beforeStorage)} after=${JSON.stringify(afterStorage)}`,
              );
            }
            await page.screenshot({ path: 'qa-standalone-wallet-funded.png', fullPage: true });

            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(4500);
            const persistedStorage = await walletStorage(page);
            const persisted = balanceFromStorage(persistedStorage);
            if (persisted !== after) {
              throw new Error(
                `Standalone Wallet: balance did not persist (${after} -> ${persisted}); ` +
                `persisted=${JSON.stringify(persistedStorage)}`,
              );
            }

            // Inverse: open Wallet/Add funds again then dismiss; storage must not move.
            await page.touchscreen.tap(300, 88);
            await page.waitForTimeout(500);
            await page.touchscreen.tap(105, 188);
            await page.waitForTimeout(1200);
            await page.touchscreen.tap(195, 516);
            await page.waitForTimeout(700);
            await page.screenshot({ path: 'qa-standalone-wallet-dismiss-before.png', fullPage: true });
            await page.keyboard.press('Escape');
            await page.waitForTimeout(800);
            const afterDismissStorage = await walletStorage(page);
            const afterDismiss = balanceFromStorage(afterDismissStorage);
            if (afterDismiss !== persisted) {
              throw new Error(
                `Standalone Wallet: dismiss changed balance (${persisted} -> ${afterDismiss})`,
              );
            }
            await page.screenshot({ path: 'qa-standalone-wallet-persisted.png', fullPage: true });
            await context.close();
            return {
              before,
              after,
              persisted,
              afterDismiss,
              beforeStorage,
              afterStorage,
              persistedStorage,
            };
          });

          fs.writeFileSync('qa-standalone-results.json', JSON.stringify(results, null, 2));
          await browser.close();
          const failed = Object.entries(results).filter(([, value]) => value.status !== 'PASS');
          if (failed.length) {
            console.error('FAILED SCENARIOS:', failed.map(([name]) => name).join(', '));
            process.exit(1);
          }
          JS
          node qa-standalone.mjs

      - name: Upload standalone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-standalone-entry-diagnostic
          path: |
            qa-standalone-*.png
            qa-standalone-*.json
          if-no-files-found: warn
