name: Batch 7 Phase 82 Saved Places Certification

on:
  pull_request:
    paths:
      - 'lib/features/home/**'
      - 'lib/features/saved_places/**'
      - 'test/saved_places/**'
      - 'test/ride/batch3_phase49_scheduled_saved_places_test.dart'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase82:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Strict analysis
        run: flutter analyze

      - name: Phase 82 Saved Places behavior
        run: |
          flutter test test/saved_places/phase82_saved_places_test.dart
          flutter test test/saved_places/saved_places_honest_state_test.dart
          flutter test test/ride/batch3_phase49_scheduled_saved_places_test.dart

      - name: Single saved-place source guard
        run: |
          test ! -e lib/features/saved_places/data/saved_places_repository.dart
          grep -q "HomeAddressRepository" lib/features/saved_places/application/saved_places_controller.dart
          grep -q "_places.changes.listen" lib/features/home/presentation/home.dart

      - name: Real Save Edit Delete guards
        run: |
          grep -q "child: Text(_saving ? 'Saving…' : 'Save')" lib/features/saved_places/presentation/add_place.dart
          grep -q "removeKind" lib/features/saved_places/presentation/saved_places.dart
          grep -q "Edit " lib/features/saved_places/presentation/saved_places.dart
