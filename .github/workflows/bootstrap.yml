name: Restore Rider Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: ${{ hashFiles('.bootstrap/project.part-*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/project.part-* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          xz -t /tmp/project.tar.xz
          tar -xJf /tmp/project.tar.xz
          test -f pubspec.yaml
          test -f lib/main.dart
      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Movera Rider source"
          git push
