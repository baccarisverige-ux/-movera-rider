name: One-shot pickup GPS race repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pickup-gps-race.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Separate live GPS from confirmed trip pickup
        run: |
          echo '' | base64 -d > /tmp/fix_pickup.py
          python3 /tmp/fix_pickup.py

      - name: Format Home
        run: dart format 'lib/features/rider/home/home.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired flow
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit repair
        run: |
          if git diff --quiet -- 'lib/features/rider/home/home.dart'; then
            echo 'No changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'lib/features/rider/home/home.dart'
          git commit -m 'Lock confirmed pickup against live GPS updates'
          git push origin HEAD:main
