name: Shrink route badges once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shrink-route-badges-once.yml'

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make pickup and dropoff badges 20 percent smaller
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/features/rider/home/home.dart')
          source = path.read_text(encoding='utf-8')
          old = 'size: ResSize.h * 44,'
          new = 'size: ResSize.h * 35.2,'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 route badge size match, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Verify
        run: |
          grep -q "size: ResSize.h \* 35.2" lib/features/rider/home/home.dart
          git diff --check

      - name: Commit change
        run: |
          git config user.name "Movera UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/shrink-route-badges-once.yml
          git add lib/features/rider/home/home.dart
          git commit -m "Make pickup and dropoff badges 20 percent smaller"
          git push origin main
