name: One-shot exact destination handoff repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-exact-destination-handoff.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch exact destination handoff
        run: python3 .github/scripts/fix_exact_destination_handoff.py

      - name: Format repaired Home flow
        run: dart format 'lib/features/rider/home/home.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired Rider
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build repaired Rider web
        run: flutter build web --release --base-href '/-movera-rider/' --pwa-strategy=none

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'lib/features/rider/home/home.dart'
          git commit -m 'Carry exact destination into ride categories'
          git push origin HEAD:main
