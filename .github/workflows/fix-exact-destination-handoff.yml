name: One-shot exact destination handoff repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-exact-destination-handoff.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch exact destination handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/rider/home/home.dart')
          text = path.read_text()

          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          once(
              "  Future<_PickupMapResult?> _openPickupMapPicker(String address) async {",
              "  Future<_PickupMapResult?> _openPickupMapPicker(\n    String address, {\n    bool isDestination = false,\n  }) async {",
              'map picker signature',
          )

          once(
              "        builder: (_) => _PickupMapPickerPage(\n          initialPosition: initialPosition,",
              "        builder: (_) => _PickupMapPickerPage(\n          initialPosition: initialPosition,\n          isDestination: isDestination,",
              'map picker builder',
          )

          once(
              "    var pickupConfirmedOnMap = false;\n    LatLng? confirmedPickupLatLng;",
              "    var pickupConfirmedOnMap = false;\n    LatLng? confirmedPickupLatLng;\n    var destinationConfirmedOnMap = false;\n    LatLng? confirmedDestinationLatLng;",
              'destination confirmation state',
          )

          once(
              "                              if (field == 'pickup') {\n                                pickupConfirmedOnMap = false;\n                                confirmedPickupLatLng = null;\n                              }",
              "                              if (field == 'pickup') {\n                                pickupConfirmedOnMap = false;\n                                confirmedPickupLatLng = null;\n                              } else if (field == 'destination') {\n                                destinationConfirmedOnMap = false;\n                                confirmedDestinationLatLng = null;\n                              }",
              'text edit invalidation',
          )

          once(
              "                routeField(\n                  field: 'destination',\n                  label: 'Final destination',\n                  hint: 'Where to?',\n                  controller: destinationController,\n                  focusNode: destinationFocus,\n                  badgeColor: const Color(0xFF1769E8),\n                ),",
              "                routeField(\n                  field: 'destination',\n                  label: 'Final destination',\n                  hint: 'Where to?',\n                  controller: destinationController,\n                  focusNode: destinationFocus,\n                  badgeColor: const Color(0xFF1769E8),\n                  onMapTap: () async {\n                    FocusScope.of(context).unfocus();\n                    final result = await _openPickupMapPicker(\n                      destinationController.text.trim(),\n                      isDestination: true,\n                    );\n                    if (result == null || !mounted) return;\n                    destinationController.text = result.address;\n                    destinationController.selection = TextSelection.collapsed(\n                      offset: destinationController.text.length,\n                    );\n                    setModalState(() {\n                      destinationConfirmedOnMap = true;\n                      confirmedDestinationLatLng = result.position;\n                      query = destinationController.text;\n                    });\n                  },\n                ),",
              'destination map action',
          )

          once(
              "                                    if (activeField == 'pickup') {\n                                      pickupConfirmedOnMap = false;\n                                      confirmedPickupLatLng = null;\n                                    }",
              "                                    if (activeField == 'pickup') {\n                                      pickupConfirmedOnMap = false;\n                                      confirmedPickupLatLng = null;\n                                    } else if (activeField == 'destination') {\n                                      destinationConfirmedOnMap = false;\n                                      confirmedDestinationLatLng = null;\n                                    }",
              'recent destination invalidation',
          )

          old_next = """                                  var exactPosition = confirmedPickupLatLng;
                                  if (!pickupConfirmedOnMap) {
                                    final result = await _openPickupMapPicker(
                                      pickupController.text.trim(),
                                    );
                                    if (result == null || !mounted) return;
                                    pickupController.text = result.address;
                                    exactPosition = result.position;
                                  }
                                  if (!mounted) return;
                                  Navigator.pop(sheetContext, {
                                    'pickup': pickupController.text.trim(),
                                    'pickupLat': exactPosition?.latitude,
                                    'pickupLng': exactPosition?.longitude,
                                    'destination': destinationController.text
                                        .trim(),
                                    'stops': stopControllers
"""
          new_next = """                                  var exactPosition = confirmedPickupLatLng;
                                  if (!pickupConfirmedOnMap) {
                                    final result = await _openPickupMapPicker(
                                      pickupController.text.trim(),
                                    );
                                    if (result == null || !mounted) return;
                                    pickupController.text = result.address;
                                    exactPosition = result.position;
                                  }

                                  var exactDestinationPosition =
                                      confirmedDestinationLatLng;
                                  if (!destinationConfirmedOnMap) {
                                    final destinationText =
                                        destinationController.text.trim();
                                    final geocodedDestination =
                                        await address_service.geocodeAddress(
                                          destinationText,
                                        );
                                    if (geocodedDestination != null) {
                                      destinationController.text =
                                          geocodedDestination.address;
                                      exactDestinationPosition = LatLng(
                                        geocodedDestination.latitude,
                                        geocodedDestination.longitude,
                                      );
                                    } else {
                                      final result = await _openPickupMapPicker(
                                        destinationText,
                                        isDestination: true,
                                      );
                                      if (result == null || !mounted) return;
                                      destinationController.text = result.address;
                                      exactDestinationPosition = result.position;
                                    }
                                  }
                                  if (!mounted ||
                                      exactPosition == null ||
                                      exactDestinationPosition == null) {
                                    return;
                                  }
                                  Navigator.pop(sheetContext, {
                                    'pickup': pickupController.text.trim(),
                                    'pickupLat': exactPosition.latitude,
                                    'pickupLng': exactPosition.longitude,
                                    'destination': destinationController.text
                                        .trim(),
                                    'destinationLat':
                                        exactDestinationPosition.latitude,
                                    'destinationLng':
                                        exactDestinationPosition.longitude,
                                    'stops': stopControllers
"""
          once(old_next, new_next, 'Next exact destination resolution')

          once(
              "    final exactPickupPosition = pickupLat != null && pickupLng != null\n        ? LatLng(pickupLat, pickupLng)\n        : (_tripPickupLatLng ?? _currentLatLng);",
              "    final exactPickupPosition = pickupLat != null && pickupLng != null\n        ? LatLng(pickupLat, pickupLng)\n        : (_tripPickupLatLng ?? _currentLatLng);\n    final destinationLat = draft['destinationLat'] as double?;\n    final destinationLng = draft['destinationLng'] as double?;\n    final exactDestinationPosition =\n        destinationLat != null && destinationLng != null\n        ? LatLng(destinationLat, destinationLng)\n        : null;",
              'draft destination coordinates',
          )

          start_marker = "    if (destination.isNotEmpty) {\n      final pickupPosition = exactPickupPosition;\n"
          search_from = text.find("final exactDestinationPosition =")
          start = text.find(start_marker, search_from)
          if start < 0:
              raise SystemExit('post-sheet destination block start not found')
          nav = text.find('      Navigator.push(\n', start)
          if nav < 0:
              raise SystemExit('post-sheet Navigator.push not found')
          replacement = """    if (destination.isNotEmpty) {
      final pickupPosition = exactPickupPosition;
      final destinationPosition = exactDestinationPosition;
      if (pickupPosition == null ||
          destinationPosition == null ||
          !mounted) {
        return;
      }
      await _mapController?.animateCamera(
        CameraUpdate.newCameraPosition(
          CameraPosition(target: destinationPosition, zoom: 15),
        ),
      );
      if (!mounted) return;

"""
          text = text[:start] + replacement + text[nav:]

          once(
              '            destinationAddress: resolvedDestination,',
              '            destinationAddress: destination,',
              'direct destination handoff',
          )

          saved_old = """    final destinationResult = await address_service.geocodeAddress(destination);
    final pickupPosition = _tripPickupLatLng ?? _currentLatLng;
    if (destinationResult == null || pickupPosition == null || !mounted) {
      return;
    }
    final destinationPosition = LatLng(
      destinationResult.latitude,
      destinationResult.longitude,
    );
    await _moveMapToAddress(destination);
    if (!mounted) return;
    Navigator.push(
"""
          saved_new = """    final pickupPosition = _tripPickupLatLng ?? _currentLatLng;
    if (pickupPosition == null || !mounted) return;
    var resolvedDestination = destination;
    LatLng? destinationPosition;
    final destinationResult = await address_service.geocodeAddress(destination);
    if (destinationResult != null) {
      resolvedDestination = destinationResult.address.trim().isNotEmpty
          ? destinationResult.address.trim()
          : destination;
      destinationPosition = LatLng(
        destinationResult.latitude,
        destinationResult.longitude,
      );
    } else {
      final result = await _openPickupMapPicker(
        destination,
        isDestination: true,
      );
      if (result == null || !mounted) return;
      resolvedDestination = result.address.trim().isNotEmpty
          ? result.address.trim()
          : destination;
      destinationPosition = result.position;
    }
    if (!mounted) return;
    Navigator.push(
"""
          once(saved_old, saved_new, 'saved destination fallback')

          # Only the saved-place SelectRide call should still use the raw destination here.
          saved_call = """          pickupAddress: _pickupAddress ?? 'Current location',
          destinationAddress: destination,
          pickupPosition: pickupPosition,
          destinationPosition: destinationPosition,
"""
          saved_call_new = """          pickupAddress: _pickupAddress ?? 'Current location',
          destinationAddress: resolvedDestination,
          pickupPosition: pickupPosition,
          destinationPosition: destinationPosition,
"""
          once(saved_call, saved_call_new, 'saved destination label')

          once(
              "  const _PickupMapPickerPage({\n    required this.initialPosition,\n    required this.initialAddress,\n  });\n\n  final LatLng initialPosition;\n  final String initialAddress;",
              "  const _PickupMapPickerPage({\n    required this.initialPosition,\n    required this.initialAddress,\n    this.isDestination = false,\n  });\n\n  final LatLng initialPosition;\n  final String initialAddress;\n  final bool isDestination;",
              'picker page destination mode',
          )

          once(
              "                    const Text(\n                      'Set exact pickup',",
              "                    Text(\n                      widget.isDestination\n                          ? 'Set exact destination'\n                          : 'Set exact pickup',",
              'picker title',
          )

          once(
              "                              _resolving ? 'Locating…' : 'Confirm pickup',",
              "                              _resolving\n                                  ? 'Locating…'\n                                  : widget.isDestination\n                                  ? 'Confirm destination'\n                                  : 'Confirm pickup',",
              'picker confirmation label',
          )

          path.write_text(text)
          PY

      - name: Format repaired Home flow
        run: dart format 'lib/features/rider/home/home.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired Rider
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build repaired Rider web
        run: flutter build web --release --base-href '/-movera-rider/' --pwa-strategy=none

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'lib/features/rider/home/home.dart'
          git commit -m 'Carry exact destination into ride categories'
          git push origin HEAD:main
