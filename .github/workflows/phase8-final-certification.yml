name: Phase 8 final frontend certification

on:
  push:
    branches:
      - phase8/final-frontend-certification
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/phase8-final-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Final frontend certification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Record candidate identity
        run: |
          echo "PHASE8_SHA=$(git rev-parse HEAD)" | tee phase8-certification.txt
          echo "PHASE8_SHORT_SHA=$(git rev-parse --short=8 HEAD)" | tee -a phase8-certification.txt
          git status --short | tee -a phase8-certification.txt

      - name: Release hygiene — tracked machine and secret files
        shell: bash
        run: |
          set -euo pipefail
          bad_files="$(git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db)$|(^|/)\.env$|(^|/)\.env\.(production|prod|staging|development|dev|local)$|\.(pem|p12|pfx|jks|keystore)$' || true)"
          if [ -n "$bad_files" ]; then
            echo "Forbidden tracked release files:" >&2
            printf '%s\n' "$bad_files" >&2
            exit 1
          fi
          echo "PASS: no forbidden tracked machine/secret files"

      - name: Release hygiene — obvious credential markers
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nE 'BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]+' -- . ':!test/**' ':!integration_test/**' ':!.github/**' || true)"
          if [ -n "$matches" ]; then
            echo "Potential credential marker found:" >&2
            printf '%s\n' "$matches" >&2
            exit 1
          fi
          echo "PASS: no obvious credential markers"

      - name: Release hygiene — production debug and unfinished markers
        shell: bash
        run: |
          set -euo pipefail
          raw_print="$(git grep -nE '(^|[^A-Za-z])print\(' -- lib web || true)"
          unfinished="$(git grep -nE '\b(TODO|FIXME|HACK)\b' -- lib web || true)"
          unexpected_debug="$(git grep -l 'debugPrint(' -- lib | grep -vE '^(lib/core/logging/app_log\.dart|lib/shared/widgets/custom_google_map\.dart)$' || true)"

          if [ -n "$raw_print" ]; then
            echo "Raw production print() output found:" >&2
            printf '%s\n' "$raw_print" >&2
            exit 1
          fi
          if [ -n "$unfinished" ]; then
            echo "Unfinished production marker found:" >&2
            printf '%s\n' "$unfinished" >&2
            exit 1
          fi
          if [ -n "$unexpected_debug" ]; then
            echo "Unexpected debugPrint location found:" >&2
            printf '%s\n' "$unexpected_debug" >&2
            exit 1
          fi

          grep -q 'if (!kDebugMode) return;' lib/core/logging/app_log.dart
          grep -q 'if (kDebugMode)' lib/shared/widgets/custom_google_map.dart
          echo "PASS: no raw production debug/TODO/FIXME/HACK markers; known debugPrint calls are kDebugMode-guarded"

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter --version | tee -a phase8-certification.txt

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full unit and widget suite
        run: flutter test

      - name: Explicit web and PWA regression suite
        shell: bash
        run: |
          if [ -d test/web ]; then
            flutter test test/web
          else
            echo "No test/web directory present" >&2
            exit 1
          fi

      - name: Explicit ride and reservation state matrices
        run: |
          flutter test \
            test/booking/ride_transition_matrix_test.dart \
            test/reservations/reservation_status_matrix_test.dart \
            test/ride/restore_surface_matrix_test.dart

      - name: Responsive and accessibility regression subset
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ui_tests < <(find test -type f \( -iname '*responsive*test.dart' -o -iname '*accessib*test.dart' -o -iname '*a11y*test.dart' -o -iname '*text_scale*test.dart' \) | sort)
          if [ "${#ui_tests[@]}" -gt 0 ]; then
            printf 'Running %s targeted responsive/a11y files:\n' "${#ui_tests[@]}"
            printf '%s\n' "${ui_tests[@]}"
            flutter test "${ui_tests[@]}"
          else
            echo "No filename-matched responsive/a11y subset; these checks remain covered by the full widget suite."
          fi

      - name: Install Linux desktop and display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
          flutter config --enable-linux-desktop

      - name: Global integration — ride booking
        run: xvfb-run -a flutter test -d linux integration_test/ride_flow_test.dart

      - name: Global integration — booking, wallet, reservations, profile
        run: xvfb-run -a flutter test -d linux integration_test/global_uat_flow_test.dart

      - name: Release web build
        run: flutter build web --release --base-href "/-movera-rider/"

      - name: Web release artifact sanity
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/manifest.json
          grep -q '<base href="/-movera-rider/">' build/web/index.html
          echo "PASS: release web artifact and GitHub Pages base href are valid" | tee -a phase8-certification.txt

      - name: Final certification marker
        run: |
          echo "PHASE8_AUTOMATED_CERTIFICATION=PASS" | tee -a phase8-certification.txt
          echo "PHYSICAL_DEVICE_CERTIFICATION=REQUIRED_SEPARATELY" | tee -a phase8-certification.txt

      - name: Upload Phase 8 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-final-certification-${{ github.sha }}
          path: |
            phase8-certification.txt
            build/web/
          if-no-files-found: warn
          retention-days: 14
