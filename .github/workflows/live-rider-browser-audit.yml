name: Audit live Rider in Chromium

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-rider-browser-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Open actual live Rider and map failing bundle lines
        run: |
          cat > live-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const baseUrl = 'https://baccarisverige-ux.github.io/-movera-rider/';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport: {width:390, height:844},
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
            locale: 'en-US',
          });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', e => pageErrors.push({message:String(e), stack:e.stack || ''}));
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });

          const url = baseUrl + '?v=live-stack-' + Date.now();
          await page.goto(url, {waitUntil:'networkidle', timeout:120000});
          await page.waitForTimeout(5000);

          const scriptUrls = await page.evaluate(() => Array.from(document.scripts).map(s => s.src).filter(Boolean));
          const mainScript = scriptUrls.find(u => /main\.[a-f0-9]+\.dart\.js/.test(u)) || scriptUrls.find(u => /main.*dart\.js/.test(u)) || null;
          let bundleSnippets = [];
          if (mainScript && pageErrors.length) {
            const js = await (await fetch(mainScript)).text();
            const lines = js.split('\n');
            const wanted = new Set();
            for (const err of pageErrors) {
              for (const match of err.stack.matchAll(/\.dart\.js:(\d+):(\d+)/g)) wanted.add(Number(match[1]));
            }
            bundleSnippets = [...wanted].sort((a,b)=>a-b).map(line => ({
              line,
              from: Math.max(1, line - 8),
              to: Math.min(lines.length, line + 8),
              text: lines.slice(Math.max(0, line - 9), Math.min(lines.length, line + 8)).map((t,i)=>`${Math.max(1,line-8)+i}: ${t}`).join('\n'),
            }));
          }

          await page.screenshot({path:'live-stack.png', fullPage:true});
          const html = await page.content();
          const report = {
            url: page.url(),
            title: await page.title(),
            pageErrors,
            consoleErrors,
            mainScript,
            bundleSnippets,
            hasFlutterView: html.includes('flutter-view') || html.includes('flt-glass-pane'),
          };
          fs.writeFileSync('live-stack.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          JS
          node live-audit.mjs

      - name: Upload live audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-rider-browser-audit
          path: |
            live-stack.png
            live-stack.json
          if-no-files-found: error
