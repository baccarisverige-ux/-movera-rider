name: Audit live Rider in Chromium

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-rider-browser-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Open actual live Rider
        run: |
          cat > live-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const url = 'https://baccarisverige-ux.github.io/-movera-rider/?v=live-audit-' + Date.now();
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport: {width:390, height:844},
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
          });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });

          await page.goto(url, {waitUntil:'networkidle', timeout:120000});
          await page.waitForTimeout(5000);

          const placeholder = page.locator('flt-semantics-placeholder');
          if (await placeholder.count()) {
            await placeholder.first().click({force:true}).catch(()=>{});
            await page.waitForTimeout(1200);
          }

          await page.screenshot({path:'live-home.png', fullPage:true});
          const text = await page.locator('body').innerText().catch(()=> '');
          const html = await page.content();
          const semantics = await page.locator('flt-semantics').allInnerTexts().catch(()=>[]);
          const report = {
            url: page.url(),
            title: await page.title(),
            bodyText: text,
            semantics,
            pageErrors,
            consoleErrors,
            hasFlutterView: html.includes('flutter-view') || html.includes('flt-glass-pane'),
          };
          fs.writeFileSync('live-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          JS
          node live-audit.mjs

      - name: Upload live audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-rider-browser-audit
          path: |
            live-home.png
            live-report.json
          if-no-files-found: error
