name: QA Book now two paths

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/ride/book_now_two_paths_e2e_test.dart'
      - '.github/workflows/qa-book-now-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book-now-two-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for this exact Pages build
        run: |
          SHORT="${GITHUB_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              echo "LIVE_BUILD=$SHORT" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "Exact deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Book now with GPS on and GPS off
        run: |
          cat > qa-book-now.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://baccarisverige-ux.github.io/-movera-rider/';

          async function enableA11y(page) {
            try { await page.getByLabel('Enable accessibility').click({ timeout: 2500 }); } catch (_) {}
            await page.waitForTimeout(400);
          }

          async function waitForMapOwner(page, expected, name) {
            try {
              await page.waitForFunction(
                owner => window.moveraMapOwner === owner,
                expected,
                { timeout: 12000 },
              );
            } catch (error) {
              const actual = await page.evaluate(() => window.moveraMapOwner || '');
              throw new Error(`${name}: expected map owner ${expected}, got ${actual || 'none'}`, { cause: error });
            }
          }

          async function bookNowPath(browser, { gps, name }) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'en-US',
              geolocation: gps ? { latitude: 59.33258, longitude: 18.0649 } : undefined,
              permissions: gps ? ['geolocation'] : [],
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto(base + `?booknow=${name}&v=${Date.now()}`, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(4500);
            await enableA11y(page);

            const where = page.getByText('Where to', { exact: false });
            if (await where.count()) await where.last.click();
            else await page.mouse.click(190, 708);
            await page.waitForTimeout(1200);

            await page.screenshot({ path: `qa-book-now-${name}-destination.png`, fullPage: true });
            let inputs = page.locator(
              'input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible',
            );
            let count = await inputs.count().catch(() => 0);
            if (!count) {
              await page.mouse.click(185, 274);
              await page.waitForTimeout(400);
              inputs = page.locator(
                'input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible',
              );
              count = await inputs.count();
            }
            if (!count) throw new Error(`${name}: visible destination input missing`);
            await inputs.last().pressSequentially('Stockholm Central Station', { delay: 10 });
            await page.waitForTimeout(700);

            const next = page.getByText('Next', { exact: true });
            if (await next.count()) await next.last.click();
            else await page.mouse.click(195, 804);
            await page.waitForTimeout(3500);
            await page.screenshot({ path: `qa-book-now-${name}-pickup.png`, fullPage: true });

            await waitForMapOwner(page, 'pickup', name);
            const onPickup = true;

            await page.mouse.click(195, 797);
            await page.waitForTimeout(7000);
            await page.screenshot({ path: `qa-book-now-${name}-categories.png`, fullPage: true });

            const categoryOwner = await page.evaluate(() => window.moveraMapOwner || '');
            if (categoryOwner === 'schedule') {
              throw new Error(`${name}: Book now opened Ride scheduled`);
            }
            if (categoryOwner !== 'select_ride') {
              throw new Error(`${name}: expected ride selection, got map owner ${categoryOwner || 'none'}`);
            }

            const select = page.getByText('Select Movera', { exact: true });
            if (await select.count()) await select.last.click();
            else {
              await page.mouse.click(195, 808);
              await page.waitForTimeout(900);
              await page.mouse.click(195, 808);
            }
            await page.waitForTimeout(4000);
            await page.screenshot({ path: `qa-book-now-${name}-finding.png`, fullPage: true });

            await waitForMapOwner(page, 'finding', name);
            const owner = await page.evaluate(() => window.moveraMapOwner || '');
            const result = { name, gps, onPickup, owner, errors };
            fs.writeFileSync(`qa-book-now-${name}.json`, JSON.stringify(result, null, 2));
            console.log('PASS: ' + name + ' reached pickup, ride selection, then Finding Driver');
            await context.close();
            return result;
          }

          const browser = await chromium.launch({ headless: true });
          const gpsOn = await bookNowPath(browser, { gps: true, name: 'gps-on' });
          const gpsOff = await bookNowPath(browser, { gps: false, name: 'gps-off' });
          if (!gpsOn.onPickup || !gpsOff.onPickup) {
            throw new Error('Both Book now paths must open Confirm pickup');
          }
          await browser.close();
          console.log('PASS: Book now GPS on and GPS off both opened Confirm pickup');
          JS
          node qa-book-now.mjs

      - name: Upload Book now E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-book-now-two-paths
          path: |
            qa-book-now-*.png
            qa-book-now-*.json
          if-no-files-found: warn
