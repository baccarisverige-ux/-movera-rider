name: QA critical diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-critical-diagnostic.yml'
      - '.github/workflows/qa-critical-rider-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for live base build
        env:
          TARGET_LIVE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'b586fccf4d452027c173f117586f11434ee5f7e6' }}
        run: |
          SHORT="${TARGET_LIVE_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/?qa_diag=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              echo "LIVE_BUILD=$SHORT" >> "$GITHUB_ENV"
              echo "Testing live Pages build $SHORT"
              exit 0
            fi
            sleep 10
          done
          echo "Target deployed bundle $SHORT not found" >&2
          exit 1
      - name: Run independent critical diagnostics
        run: |
          cat > qa-diagnostic.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://baccarisverige-ux.github.io/-movera-rider/';
          const results = {};

          async function enableA11y(page) {
            try { await page.getByLabel('Enable accessibility').click({ timeout: 2500 }); } catch (_) {}
            await page.waitForTimeout(400);
          }

          async function waitOwner(page, expected, label, timeout = 15000) {
            await page.waitForFunction(owner => window.moveraMapOwner === owner, expected, { timeout })
              .catch(async error => {
                const actual = await page.evaluate(() => window.moveraMapOwner || 'none');
                throw new Error(`${label}: expected ${expected}, got ${actual}`, { cause: error });
              });
          }

          async function newContext(browser, { standalone = false } = {}) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'en-US',
              geolocation: { latitude: 59.33258, longitude: 18.0649 },
              permissions: ['geolocation'],
            });
            if (standalone) {
              await context.addInitScript(() => {
                Object.defineProperty(navigator, 'standalone', { configurable: true, get: () => true });
              });
            }
            return context;
          }

          async function openHome(page, name) {
            await page.goto(base + `?diag=${name}&v=${Date.now()}`, { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(4500);
            await enableA11y(page);
          }

          async function openSelection(page, name) {
            await openHome(page, name);
            const where = page.getByText('Where to', { exact: false });
            if (await where.count()) await where.last().click(); else await page.mouse.click(190, 708);
            await page.waitForTimeout(1200);
            let inputs = page.locator('input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible');
            let count = await inputs.count().catch(() => 0);
            if (!count) {
              await page.mouse.click(185, 274);
              await page.waitForTimeout(400);
              inputs = page.locator('input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible');
              count = await inputs.count();
            }
            if (!count) throw new Error(`${name}: destination input missing`);
            await inputs.last().pressSequentially('Stockholm Central Station', { delay: 10 });
            await page.waitForTimeout(700);
            const next = page.getByText('Next', { exact: true });
            if (await next.count()) await next.last().click(); else await page.mouse.click(195, 804);
            await page.waitForTimeout(3500);
            await waitOwner(page, 'pickup', `${name}: pickup`);
            await page.mouse.click(195, 797);
            await page.waitForTimeout(7000);
            await waitOwner(page, 'select_ride', `${name}: selection`);
          }

          async function enterFinding(page, name) {
            await openSelection(page, name);
            const select = page.getByText('Select Movera', { exact: true });
            if (await select.count()) await select.last().click();
            else { await page.mouse.click(195, 808); await page.waitForTimeout(900); await page.mouse.click(195, 808); }
            await waitOwner(page, 'finding', `${name}: finding`, 15000);
          }

          async function openWallet(page, name) {
            await openHome(page, name);
            const menu = page.getByLabel('Menu');
            if (!(await menu.count())) throw new Error(`${name}: Menu missing`);
            await menu.last().click();
            const wallet = page.getByText('Wallet', { exact: true });
            await wallet.last().waitFor({ state: 'visible', timeout: 5000 });
            await wallet.last().click();
            await page.getByText('Available balance', { exact: true }).waitFor({ state: 'visible', timeout: 7000 });
          }

          async function visibleBalance(page) {
            const values = await page.getByText(/^kr\s+\d+(?:\.\d+)?$/).allTextContents();
            const parsed = values.map(v => Number(v.replace(/[^0-9.]/g, ''))).filter(Number.isFinite);
            if (!parsed.length) throw new Error('Wallet: balance missing');
            return parsed[0];
          }

          async function runScenario(name, fn) {
            try {
              const value = await fn();
              results[name] = { status: 'PASS', ...value };
              console.log(`PASS ${name}`);
            } catch (error) {
              results[name] = { status: 'FAIL', error: String(error?.stack || error) };
              console.error(`FAIL ${name}:`, error);
            }
          }

          const browser = await chromium.launch({ headless: true });

          await runScenario('payment', async () => {
            const context = await newContext(browser);
            const page = await context.newPage();
            await openSelection(page, 'payment');
            await page.screenshot({ path: 'qa-diag-payment-before.png', fullPage: true });
            await page.touchscreen.tap(350, 666);
            await page.waitForTimeout(700);
            await page.screenshot({ path: 'qa-diag-payment-after-one-tap.png', fullPage: true });
            const semantics = await page.locator('flt-semantics').evaluateAll(nodes => nodes.map(node => {
              const r = node.getBoundingClientRect();
              return {
                label: node.getAttribute('aria-label'),
                role: node.getAttribute('role'),
                text: node.textContent,
                top: Math.round(r.top), bottom: Math.round(r.bottom), left: Math.round(r.left), right: Math.round(r.right),
              };
            }).filter(x => x.bottom >= 420 && x.top <= 844));
            fs.writeFileSync('qa-diag-payment-semantics.json', JSON.stringify(semantics, null, 2));
            const changed = await page.screenshot({ path: 'qa-diag-payment-state.png', fullPage: true });
            await context.close();
            return { semanticsCount: semantics.length, screenshotBytes: changed.length };
          });

          await runScenario('finding_waiting', async () => {
            const context = await newContext(browser);
            const page = await context.newPage();
            await enterFinding(page, 'waiting');
            await page.screenshot({ path: 'qa-diag-finding.png', fullPage: true });
            await waitOwner(page, 'waiting', 'finding→waiting', 45000);
            const owner = await page.evaluate(() => window.moveraMapOwner || 'none');
            await page.screenshot({ path: 'qa-diag-waiting.png', fullPage: true });
            await context.close();
            return { owner };
          });

          await runScenario('cancel_standalone', async () => {
            const context = await newContext(browser, { standalone: true });
            const page = await context.newPage();
            await enterFinding(page, 'cancel');
            const cancelEntry = page.getByLabel('Collapse');
            if (!(await cancelEntry.count())) throw new Error('Cancel control missing');
            await cancelEntry.last().click();
            await page.getByText('Cancel ride?', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('Cancel request', { exact: true }).click();
            await page.getByText('Why are you cancelling?', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('Skip', { exact: true }).click();
            await page.getByText('Where to', { exact: false }).last().waitFor({ state: 'visible', timeout: 10000 });
            await page.waitForTimeout(28000);
            const owner = await page.evaluate(() => window.moveraMapOwner || 'none');
            if (owner === 'finding' || owner === 'waiting') throw new Error(`Ride resurrected: ${owner}`);
            await page.screenshot({ path: 'qa-diag-cancel-home.png', fullPage: true });
            await context.close();
            return { owner };
          });

          await runScenario('wallet_standalone', async () => {
            const context = await newContext(browser, { standalone: true });
            const page = await context.newPage();
            await openWallet(page, 'wallet');
            const before = await visibleBalance(page);
            await page.getByText('Add funds', { exact: true }).last().click();
            await page.waitForTimeout(700);
            await page.screenshot({ path: 'qa-diag-wallet-sheet.png', fullPage: true });
            const payWithVisible = await page.getByText('PAY WITH', { exact: true }).isVisible().catch(() => false);
            if (!payWithVisible) throw new Error('Add funds sheet did not expose PAY WITH');
            await page.getByText('kr 100', { exact: true }).click();
            await page.getByText('Card', { exact: true }).click();
            await page.waitForTimeout(1200);
            const after = await visibleBalance(page);
            if (after !== before + 100) throw new Error(`Expected ${before + 100}, got ${after}`);
            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(4500);
            await enableA11y(page);
            await page.getByLabel('Menu').last().click();
            await page.getByText('Wallet', { exact: true }).last().click();
            await page.getByText('Available balance', { exact: true }).waitFor({ state: 'visible', timeout: 7000 });
            const persisted = await visibleBalance(page);
            if (persisted !== after) throw new Error(`Persistence failed ${after} -> ${persisted}`);
            await page.screenshot({ path: 'qa-diag-wallet-persisted.png', fullPage: true });
            await context.close();
            return { before, after, persisted };
          });

          fs.writeFileSync('qa-diag-results.json', JSON.stringify(results, null, 2));
          await browser.close();
          const failed = Object.entries(results).filter(([, value]) => value.status !== 'PASS');
          if (failed.length) {
            console.error('FAILED SCENARIOS:', failed.map(([name]) => name).join(', '));
            process.exit(1);
          }
          JS
          node qa-diagnostic.mjs
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-critical-diagnostic
          path: |
            qa-diag-*.png
            qa-diag-*.json
          if-no-files-found: warn
