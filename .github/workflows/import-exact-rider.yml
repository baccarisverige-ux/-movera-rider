name: Import Exact Rider Files

on:
  push:
    branches: [main]
    paths:
      - 'rider_exact_full.part03'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: exact-rider-import
  cancel-in-progress: false

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all four exact transfer parts
        run: |
          echo "f3e292dc7875c5400e6555b1510ab60890d3d1286d053b60589e491611efb302  rider_exact_full.part00" | sha256sum -c -
          echo "b95d31590876e0101acc07dfce4fa1fd3baba8d7e0a63990c5b9715cd5166cd0  rider_exact_full.part01" | sha256sum -c -
          echo "5056650bda8e877e8db0796fae9410af9e1cefcd4f7725767ca5a4754db05dc2  rider_exact_full.part02" | sha256sum -c -
          echo "4368d0ac32e71a5879aeb8d0a3e83ad673b16af237dbe71b6a8bcef60a8b04ac  rider_exact_full.part03" | sha256sum -c -
          cat rider_exact_full.part00 rider_exact_full.part01 rider_exact_full.part02 rider_exact_full.part03 > /tmp/riding_app_rider_exact.zip
          echo "86c4c49daf8bd7bb355826a2c61b3855ec151b68b53ddde0657b30d93867bf48  /tmp/riding_app_rider_exact.zip" | sha256sum -c -
          unzip -t /tmp/riding_app_rider_exact.zip >/dev/null

      - name: Replace repository with all 689 exact Rider files
        run: |
          rm -rf /tmp/rider-exact
          mkdir -p /tmp/rider-exact
          unzip -q /tmp/riding_app_rider_exact.zip -d /tmp/rider-exact
          test -d /tmp/rider-exact/riding_app
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rider-exact/riding_app/. .
          git add -Af .
          FILE_COUNT="$(git ls-files | wc -l)"
          ACTUAL_TREE="$(git write-tree)"
          echo "Exact Rider file count: $FILE_COUNT"
          echo "Exact Rider tree: $ACTUAL_TREE"
          test "$FILE_COUNT" = "689"
          test "$ACTUAL_TREE" = "583ab919ea9ccc55b899b3add30d546b79ea6f32"

      - name: Commit exact Rider tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git commit -m "Import all 689 exact Rider files from original riding_app.zip"
          git push origin main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare temporary Web build without altering committed source
        run: |
          rm -rf .dart_tool build android/.gradle
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/widgets/responsive_size.dart')
          b=p.read_bytes()
          old=b'double screenHorizPadding = ScreenUtil().setWidth(16);'
          new=b'double get screenHorizPadding => ScreenUtil().setWidth(16);'
          if old in b:
              p.write_bytes(b.replace(old,new,1))
          PY

      - run: flutter pub get

      - name: Build Rider Web from exact committed source
        run: flutter build web --release --base-href "/-movera-rider/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: import-build
    steps:
      - name: Deploy exact Rider to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
