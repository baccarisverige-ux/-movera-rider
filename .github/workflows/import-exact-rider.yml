name: Import Exact Rider Files

on:
  push:
    branches: [main]
    paths:
      - '1.zip'
      - '2.zip'
      - '3.zip'
      - '4.zip'
      - '.github/workflows/import-exact-rider.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: exact-rider-import
  cancel-in-progress: false

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify uploaded Rider ZIP wrappers
        run: |
          echo "0d8baadfd2cf7c9fb2dda6af69adb23a0ffcb46a895a84a0e982c0d73295a484  1.zip" | sha256sum -c -
          echo "282ce890a527740ae27a8839ac2a49adfb8af9a18e21707f0bd8d4a65f2cd45f  2.zip" | sha256sum -c -
          echo "f3cb73200aeff584a2eb2228f0f44af102f2eb9c6b7f8f0c0196d488b2f4e342  3.zip" | sha256sum -c -
          echo "a8b49e17ce61e4aec751a216b578a3f376fba88ba0e4f7ee5b4dd71561e811fc  4.zip" | sha256sum -c -

      - name: Reconstruct exact Rider archive
        run: |
          unzip -p 1.zip rider_exact_full.part00 > /tmp/rider.part00
          unzip -p 2.zip rider_exact_full.part01 > /tmp/rider.part01
          unzip -p 3.zip rider_exact_full.part02 > /tmp/rider.part02
          unzip -p 4.zip rider_exact_full.part03 > /tmp/rider.part03
          echo "f3e292dc7875c5400e6555b1510ab60890d3d1286d053b60589e491611efb302  /tmp/rider.part00" | sha256sum -c -
          echo "b95d31590876e0101acc07dfce4fa1fd3baba8d7e0a63990c5b9715cd5166cd0  /tmp/rider.part01" | sha256sum -c -
          echo "5056650bda8e877e8db0796fae9410af9e1cefcd4f7725767ca5a4754db05dc2  /tmp/rider.part02" | sha256sum -c -
          echo "4368d0ac32e71a5879aeb8d0a3e83ad673b16af237dbe71b6a8bcef60a8b04ac  /tmp/rider.part03" | sha256sum -c -
          cat /tmp/rider.part00 /tmp/rider.part01 /tmp/rider.part02 /tmp/rider.part03 > /tmp/riding_app_rider_exact.zip
          echo "86c4c49daf8bd7bb355826a2c61b3855ec151b68b53ddde0657b30d93867bf48  /tmp/riding_app_rider_exact.zip" | sha256sum -c -
          unzip -t /tmp/riding_app_rider_exact.zip >/dev/null

      - name: Replace repository with exact 689-file Rider tree
        run: |
          rm -rf /tmp/rider-exact
          mkdir -p /tmp/rider-exact
          unzip -q /tmp/riding_app_rider_exact.zip -d /tmp/rider-exact
          test -d /tmp/rider-exact/riding_app
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rider-exact/riding_app/. .
          git config core.autocrlf false
          git add -Af .
          FILE_COUNT="$(git ls-files | wc -l)"
          ACTUAL_TREE="$(git write-tree)"
          echo "Rider file count: $FILE_COUNT"
          echo "Rider tree: $ACTUAL_TREE"
          test "$FILE_COUNT" = "689"
          test "$ACTUAL_TREE" = "583ab919ea9ccc55b899b3add30d546b79ea6f32"

      - name: Commit exact Rider source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git commit -m "Import exact Rider files from original riding_app.zip"
          git push origin main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare temporary Web build only
        run: |
          rm -rf .dart_tool build android/.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/widgets/responsive_size.dart')
          b = p.read_bytes()
          old = b'double screenHorizPadding = ScreenUtil().setWidth(16);'
          new = b'double get screenHorizPadding => ScreenUtil().setWidth(16);'
          if old in b:
              p.write_bytes(b.replace(old, new, 1))
          PY

      - run: flutter pub get
      - run: flutter build web --release --base-href "/-movera-rider/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: import-build
    steps:
      - name: Deploy exact Rider
        id: deployment
        uses: actions/deploy-pages@v4
