name: Import Exact Rider Files

on:
  push:
    branches: [main]
    paths:
      - 'rider_exact_full.part04'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: exact-rider-import
  cancel-in-progress: false

jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all five exact transfer parts
        run: |
          echo "562734dc21215ce52ed46cb4e742aabf9ad6662d9474277701e5ddd4e654c2c6  rider_exact_full.part00" | sha256sum -c -
          echo "ae0f5fa285c3819ce4fae9fddea43f070c6e1fdfb0f683b308a986c6a8d136b1  rider_exact_full.part01" | sha256sum -c -
          echo "b2f4d9b3ca6148932b96bc253ec700c5e5cc1d05ee591c6a479dcfb6fcdd82e3  rider_exact_full.part02" | sha256sum -c -
          echo "90242a93aeb34577e364ce483c2778c0b7b438b57340a0dd4996c9447950aad7  rider_exact_full.part03" | sha256sum -c -
          echo "c2ede013b93592e9fa5284e2bc12c18baa89116e082c9d6929111a4b90ab8731  rider_exact_full.part04" | sha256sum -c -
          cat rider_exact_full.part00 rider_exact_full.part01 rider_exact_full.part02 rider_exact_full.part03 rider_exact_full.part04 > /tmp/riding_app_rider_exact.zip
          echo "86c4c49daf8bd7bb355826a2c61b3855ec151b68b53ddde0657b30d93867bf48  /tmp/riding_app_rider_exact.zip" | sha256sum -c -
          unzip -t /tmp/riding_app_rider_exact.zip >/dev/null

      - name: Replace repository with all 689 exact Rider files
        run: |
          rm -rf /tmp/rider-exact
          mkdir -p /tmp/rider-exact
          unzip -q /tmp/riding_app_rider_exact.zip -d /tmp/rider-exact
          test -d /tmp/rider-exact/riding_app
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rider-exact/riding_app/. .
          git add -Af .
          FILE_COUNT="$(git ls-files | wc -l)"
          ACTUAL_TREE="$(git write-tree)"
          echo "Exact Rider file count: $FILE_COUNT"
          echo "Exact Rider tree: $ACTUAL_TREE"
          test "$FILE_COUNT" = "689"
          test "$ACTUAL_TREE" = "583ab919ea9ccc55b899b3add30d546b79ea6f32"

      - name: Commit exact Rider tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git commit -m "Import all 689 exact Rider files from original riding_app.zip"
          git push origin main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare temporary Web build without altering committed source
        run: |
          rm -rf .dart_tool build android/.gradle
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/widgets/responsive_size.dart')
          b=p.read_bytes()
          old=b'double screenHorizPadding = ScreenUtil().setWidth(16);'
          new=b'double get screenHorizPadding => ScreenUtil().setWidth(16);'
          if old in b:
              p.write_bytes(b.replace(old,new,1))
          PY

      - run: flutter pub get

      - name: Build Rider Web from exact committed source
        run: flutter build web --release --base-href "/-movera-rider/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: import-build
    steps:
      - name: Deploy exact Rider to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
