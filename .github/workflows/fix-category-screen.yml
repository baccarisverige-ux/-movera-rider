name: One-shot category screen fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-category-screen.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch category flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          select_path = Path('lib/features/rider/select ride/select_ride.dart')
          select = select_path.read_text()
          select = replace_once(
              select,
              '        icon: BitmapDescriptor.defaultMarkerWithHue(BitmapDescriptor.hueAzure),\n',
              '        icon: BitmapDescriptor.defaultMarker,\n',
              'pickup marker',
          )
          select = replace_once(
              select,
              '        icon: BitmapDescriptor.defaultMarkerWithHue(BitmapDescriptor.hueRed),\n',
              '        icon: BitmapDescriptor.defaultMarker,\n',
              'destination marker',
          )
          select = replace_once(
              select,
              '                markers: _markers,\n                myLocationEnabled: true,\n',
              '                markers: _markers,\n                myLocationEnabled: false,\n',
              'web location layer',
          )
          select_path.write_text(select)

          home_path = Path('lib/features/rider/home/home.dart')
          home = home_path.read_text()
          old = '''    if (destination.isNotEmpty) {
            final destinationResult = await address_service.geocodeAddress(
              destination,
            );
            final pickupPosition = exactPickupPosition;
            if (destinationResult == null || pickupPosition == null || !mounted) {
              return;
            }
            final destinationPosition = LatLng(
              destinationResult.latitude,
              destinationResult.longitude,
            );
            await _moveMapToAddress(destination);
            if (!mounted) return;
            Navigator.push(
          '''
          new = '''    if (destination.isNotEmpty) {
            final pickupPosition = exactPickupPosition;
            if (pickupPosition == null || !mounted) return;

            var resolvedDestination = destination;
            LatLng? destinationPosition;
            final destinationResult = await address_service.geocodeAddress(
              destination,
            );
            if (destinationResult != null) {
              resolvedDestination = destinationResult.address.trim().isNotEmpty
                  ? destinationResult.address.trim()
                  : destination;
              destinationPosition = LatLng(
                destinationResult.latitude,
                destinationResult.longitude,
              );
            } else {
              final exactDestination = await _openPickupMapPicker(destination);
              if (exactDestination == null || !mounted) return;
              resolvedDestination = exactDestination.address.trim().isNotEmpty
                  ? exactDestination.address.trim()
                  : destination;
              destinationPosition = exactDestination.position;
            }

            setState(() {
              _destinationAddress = resolvedDestination;
              _rememberAddress(resolvedDestination);
            });
            await _persistAddressData();
            await _mapController?.animateCamera(
              CameraUpdate.newCameraPosition(
                CameraPosition(target: destinationPosition, zoom: 15),
              ),
            );
            if (!mounted) return;
            Navigator.push(
          '''
          home = replace_once(home, old, new, 'destination navigation gate')
          home = replace_once(
              home,
              '''            pickupAddress: pickup.isNotEmpty
                        ? pickup
                        : (_pickupAddress ?? 'Current location'),
                      destinationAddress: destination,
          ''',
              '''            pickupAddress: pickup.isNotEmpty
                        ? pickup
                        : (_pickupAddress ?? 'Current location'),
                      destinationAddress: resolvedDestination,
          ''',
              'resolved destination handoff',
          )
          home_path.write_text(home)
          PY

      - name: Format repaired files
        run: dart format 'lib/features/rider/home/home.dart' 'lib/features/rider/select ride/select_ride.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired flow
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'lib/features/rider/home/home.dart' 'lib/features/rider/select ride/select_ride.dart'
          git commit -m 'Fix category screen navigation on web'
          git push origin HEAD:main
