name: Fix live Home sheet null crash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-sheet-controller-null.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Guard SheetController value reads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/rider/home/home.dart')
          s = p.read_text()
          replacements = [
              (
                  "  bool get _isSheetAtMiddle {\n    final offset = _homeSheetController.value;\n    if (offset == null) return false;\n",
                  "  bool get _isSheetAtMiddle {\n    if (!_homeSheetController.hasClient) return false;\n    final offset = _homeSheetController.value;\n    if (offset == null) return false;\n",
              ),
              (
                  "  void _syncHomeSheetState() {\n    final offset = _homeSheetController.value;\n    if (!mounted || offset == null) return;\n",
                  "  void _syncHomeSheetState() {\n    if (!mounted || !_homeSheetController.hasClient) return;\n    final offset = _homeSheetController.value;\n    if (offset == null) return;\n",
              ),
              (
                  "  void _toggleHomeSheet() {\n    final offset = _homeSheetController.value ?? _sheetMinPixels;\n",
                  "  void _toggleHomeSheet() {\n    final offset = _homeSheetController.hasClient\n        ? (_homeSheetController.value ?? _sheetMinPixels)\n        : _sheetMinPixels;\n",
              ),
              (
                  "                        final sheetHeight =\n                            _homeSheetController.value ?? _sheetMinPixels;\n",
                  "                        final sheetHeight = _homeSheetController.hasClient\n                            ? (_homeSheetController.value ?? _sheetMinPixels)\n                            : _sheetMinPixels;\n",
              ),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one exact match, found {count}: {old[:70]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          print('Guarded all four live SheetController.value reads.')
          PY

      - name: Format Home
        run: dart format 'lib/features/rider/home/home.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build repaired web app
        run: flutter build web --release --base-href '/-movera-rider/' --pwa-strategy=none

      - name: Verify SheetController guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/features/rider/home/home.dart').read_text()
          if s.count('_homeSheetController.hasClient') < 5:
              raise SystemExit('Expected Home sheet hasClient guards are missing')
          for marker in [
              'bool get _isSheetAtMiddle',
              'void _syncHomeSheetState()',
              'void _toggleHomeSheet()',
              'final sheetHeight = _homeSheetController.hasClient',
          ]:
              if marker not in s:
                  raise SystemExit(f'Missing guarded source marker: {marker}')
          print('SheetController value reads are guarded.')
          PY

      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'lib/features/rider/home/home.dart'
          git commit -m 'Guard Home sheet controller before reading offset'
          git push origin HEAD:main
