name: Publish Rider Web Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: movera-rider-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --pwa-strategy=none

      - name: Configure Google Maps for web
        env:
          MAPS_WEB_API_KEY: ${{ secrets.MAPS1 || secrets.MAPS || vars.MAPS || secrets.GOOGLE_MAPS_WEB_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_WEB_API_KEY" ]; then
            echo "::error::Missing Google Maps API key. Add the MAPS1 repository secret."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path('build/web/index.html')
          s = p.read_text()
          bootstrap = '  <script src="flutter_bootstrap.js" defer></script>'
          maps = f'  <script src="https://maps.googleapis.com/maps/api/js?key={os.environ["MAPS_WEB_API_KEY"]}"></script>'
          if bootstrap not in s:
              raise SystemExit('Flutter bootstrap tag not found')
          if 'maps.googleapis.com/maps/api/js' not in s:
              s = s.replace(bootstrap, maps + '\n' + bootstrap)
          p.write_text(s)
          PY

      - name: Fingerprint compiled Flutter bundle
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          build = Path('build/web')
          version = os.environ['GITHUB_SHA'][:8]
          main = build / 'main.dart.js'
          bootstrap = build / 'flutter_bootstrap.js'
          index = build / 'index.html'

          versioned_main = f'main.{version}.dart.js'
          versioned_bootstrap = f'flutter_bootstrap.{version}.js'

          bootstrap_text = bootstrap.read_text()
          bootstrap_text = bootstrap_text.replace('main.dart.js', versioned_main)
          bootstrap.write_text(bootstrap_text)
          main.rename(build / versioned_main)
          bootstrap.rename(build / versioned_bootstrap)

          index_text = index.read_text()
          index_text = index_text.replace(
              'flutter_bootstrap.js',
              versioned_bootstrap,
          )
          index.write_text(index_text)
          PY

      - name: Prepare GitHub Pages build
        run: |
          rm -rf /tmp/movera-pages
          mkdir -p /tmp/movera-pages
          cp -a build/web/. /tmp/movera-pages/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/movera-pages/index.html')
          s = p.read_text()
          s = s.replace('<base href="/">', '<base href="/-movera-rider/">')
          p.write_text(s)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/movera-pages

      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Point compiled app assets to public CDN
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/web/index.html')
          s = p.read_text()
          s = s.replace('<base href="/">', '<base href="https://cdn.jsdelivr.net/gh/baccarisverige-ux/-movera-rider@web-live/">')
          p.write_text(s)
          PY

      - name: Publish compiled output to web-live branch
        run: |
          rm -rf /tmp/movera-web
          mkdir -p /tmp/movera-web
          cp -a build/web/. /tmp/movera-web/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan web-live
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/movera-web/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish Movera Rider web build"
          git push --force origin web-live
