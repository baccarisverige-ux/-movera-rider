name: Extract uploaded Rider project parts

on:
  push:
    paths:
      - '.github/workflows/extract-uploaded-parts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Rider upload parts exactly
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            rider-part-1-source.zip
            rider-part-2-assets.zip
            rider-part-3-mobile-web.zip
            rider-part-4-project-files.zip
          )
          for part in "${parts[@]}"; do
            test -f "$part" || { echo "Missing $part"; exit 1; }
            unzip -oq "$part" -d .
          done

      - name: Commit extracted Rider files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi
          git commit -m "Extract uploaded Rider project files"
          git push origin HEAD:main
