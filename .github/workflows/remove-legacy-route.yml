name: Remove legacy rider route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-route.yml'
      - '.github/scripts/remove_legacy_route.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove original ChooseRoute chain
        run: python3 .github/scripts/remove_legacy_route.py

      - name: Format changed Rider files
        run: dart format 'lib/features/rider/home/home.dart' 'lib/features/rider/schedule ride/schedule_ride.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze without legacy route
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Rider web without legacy route
        run: flutter build web --release --base-href '/-movera-rider/' --pwa-strategy=none

      - name: Verify legacy route is absent
        run: |
          if grep -R -n -E 'ChooseRoute|Central Park, DHA|33\.6844, 73\.0479' lib --include='*.dart'; then
            echo 'Legacy Rider route/data still exists.'
            exit 1
          fi

      - name: Commit validated cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A 'lib/features/rider/home/home.dart' 'lib/features/rider/schedule ride/schedule_ride.dart' 'lib/features/rider/choose route'
          git commit -m 'Remove legacy original ride route'
          git push origin HEAD:main
