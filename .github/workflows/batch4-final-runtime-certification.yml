name: Batch 4 Final Runtime Certification

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - '.github/workflows/batch4-final-runtime-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-runtime-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop + display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - name: Strict static analysis
        run: flutter analyze
      - name: Full unit and widget regression suite
        run: flutter test
      - name: Destructive persistence and lifecycle recovery
        run: |
          flutter test test/ride/ride_snapshot_store_race_test.dart
          flutter test test/ride/realtime_terminal_resync_test.dart
          flutter test test/ride/waiting_external_terminal_test.dart
      - name: Scheduled ride convergence
        run: |
          flutter test test/reservations/scheduled_trip_contract_test.dart
          flutter test test/reservations/batch4_phase61_reservation_clock_test.dart
      - name: Completion and transition stability
        run: flutter test test/ride/batch4_phase56_transition_feedback_stability_test.dart
      - name: On-demand ride flow
        run: xvfb-run -a flutter test -d linux integration_test/ride_flow_test.dart
      - name: Full rider lifecycle
        run: xvfb-run -a flutter test -d linux integration_test/rider_full_uat_test.dart
      - name: All lifecycle and recovery paths
        run: xvfb-run -a flutter test -d linux integration_test/pre15_all_lifecycle_paths_test.dart
      - name: Cross-feature runtime UAT
        run: xvfb-run -a flutter test -d linux integration_test/global_uat_flow_test.dart
