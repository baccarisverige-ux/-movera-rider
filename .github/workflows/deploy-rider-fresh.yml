name: Deploy Fresh Rider Passenger Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-rider-fresh.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Rider runtime from exact source
        run: |
          rm -rf .dart_tool build android/.gradle
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/widgets/responsive_size.dart')
          b = p.read_bytes()
          old = b'double screenHorizPadding = ScreenUtil().setWidth(16);'
          new = b'double get screenHorizPadding => ScreenUtil().setWidth(16);'
          if old in b:
              p.write_bytes(b.replace(old, new, 1))

          p = Path('lib/presentation/common/splash/splash.dart')
          b = p.read_bytes()
          old_import = b"import 'package:riding_app/presentation/common/onboarding/onboarding.dart';"
          new_import = b"import 'package:riding_app/presentation/passenger/auth/login/login.dart';"
          old_route = b'RightToLeftTransition(const OnboardingScreen(isDriver: false))'
          new_route = b'RightToLeftTransition(const PassengerLogin())'
          if old_import not in b or old_route not in b:
              raise SystemExit('Expected exact Rider splash source not found; refusing patch.')
          p.write_bytes(b.replace(old_import, new_import, 1).replace(old_route, new_route, 1))
          PY

      - run: flutter pub get

      - name: Build fresh uncached Rider
        run: flutter build web --release --pwa-strategy=none --base-href "/-movera-rider/fresh-rider/"

      - name: Stage fresh Rider path
        run: |
          mkdir -p site/fresh-rider
          cp -a build/web/. site/fresh-rider/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy fresh Rider
        id: deployment
        uses: actions/deploy-pages@v4
