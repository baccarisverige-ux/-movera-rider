name: Redesign exact pickup screen once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-exact-pickup-once.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact pickup redesign
        run: python3 .github/scripts/redesign_exact_pickup.py

      - name: Verify redesign
        run: |
          grep -q "Drag map to move pin" lib/features/rider/home/home.dart
          grep -q "Confirm pickup" lib/features/rider/home/home.dart
          grep -q "class _PremiumPickupPin" lib/features/rider/home/home.dart
          git diff --check

      - name: Commit redesign and cleanup
        run: |
          git config user.name "Movera UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/redesign-exact-pickup-once.yml .github/scripts/redesign_exact_pickup.py
          git add lib/features/rider/home/home.dart
          git commit -m "Redesign exact pickup screen with clean Movera theme"
          git push origin main
