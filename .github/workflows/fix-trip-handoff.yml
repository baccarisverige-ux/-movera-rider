name: One-shot trip handoff repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-trip-handoff.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch exact trip handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home_path = Path('lib/features/rider/home/home.dart')
          select_path = Path('lib/features/rider/select ride/select_ride.dart')
          legacy_path = Path('lib/features/rider/choose route/set on map/set_on_map.dart')

          home = home_path.read_text()
          select = select_path.read_text()
          legacy = legacy_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count={count}')
              return text.replace(old, new, 1)

          old_ctor = (
              "class SelectRide extends StatefulWidget {\n"
              "  const SelectRide({super.key});\n\n"
              "  @override\n"
              "  State<SelectRide> createState() => _SelectRideState();\n"
              "}\n"
          )
          new_ctor = (
              "class SelectRide extends StatefulWidget {\n"
              "  const SelectRide({\n"
              "    super.key,\n"
              "    required this.pickupAddress,\n"
              "    required this.destinationAddress,\n"
              "    required this.pickupPosition,\n"
              "    required this.destinationPosition,\n"
              "    this.stops = const <String>[],\n"
              "  });\n\n"
              "  final String pickupAddress;\n"
              "  final String destinationAddress;\n"
              "  final LatLng pickupPosition;\n"
              "  final LatLng destinationPosition;\n"
              "  final List<String> stops;\n\n"
              "  @override\n"
              "  State<SelectRide> createState() => _SelectRideState();\n"
              "}\n"
          )
          select = replace_once(select, old_ctor, new_ctor, 'SelectRide constructor')

          old_map_state = (
              "  DateTime? _scheduledFor;\n"
              "  GoogleMapController? _mapController;\n"
              "  final Set<Marker> _markers = {\n"
              "    Marker(\n"
              "      markerId: const MarkerId('driver_location'),\n"
              "      position: const LatLng(33.6844, 73.0479),\n"
              "      infoWindow: const InfoWindow(title: 'Pickup'),\n"
              "      icon: BitmapDescriptor.defaultMarkerWithHue(BitmapDescriptor.hueAzure),\n"
              "    ),\n"
              "  };\n\n"
              "  static const CameraPosition _initialPosition = CameraPosition(\n"
              "    target: LatLng(33.6844, 73.0479),\n"
              "    zoom: 14,\n"
              "  );\n"
          )
          new_map_state = (
              "  DateTime? _scheduledFor;\n"
              "  GoogleMapController? _mapController;\n"
              "  late final Set<Marker> _markers;\n"
              "  late final CameraPosition _initialPosition;\n\n"
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    _initialPosition = CameraPosition(\n"
              "      target: widget.pickupPosition,\n"
              "      zoom: 14,\n"
              "    );\n"
              "    _markers = {\n"
              "      Marker(\n"
              "        markerId: const MarkerId('pickup'),\n"
              "        position: widget.pickupPosition,\n"
              "        infoWindow: InfoWindow(title: widget.pickupAddress),\n"
              "        icon: BitmapDescriptor.defaultMarkerWithHue(BitmapDescriptor.hueAzure),\n"
              "      ),\n"
              "      Marker(\n"
              "        markerId: const MarkerId('destination'),\n"
              "        position: widget.destinationPosition,\n"
              "        infoWindow: InfoWindow(title: widget.destinationAddress),\n"
              "        icon: BitmapDescriptor.defaultMarkerWithHue(BitmapDescriptor.hueRed),\n"
              "      ),\n"
              "    };\n"
              "  }\n\n"
              "  Future<void> _fitRoute() async {\n"
              "    final controller = _mapController;\n"
              "    if (controller == null || !mounted) return;\n"
              "    final pickup = widget.pickupPosition;\n"
              "    final destination = widget.destinationPosition;\n"
              "    final samePoint =\n"
              "        (pickup.latitude - destination.latitude).abs() < 0.00001 &&\n"
              "        (pickup.longitude - destination.longitude).abs() < 0.00001;\n"
              "    if (samePoint) {\n"
              "      await controller.animateCamera(\n"
              "        CameraUpdate.newCameraPosition(\n"
              "          CameraPosition(target: pickup, zoom: 15),\n"
              "        ),\n"
              "      );\n"
              "      return;\n"
              "    }\n"
              "    final bounds = LatLngBounds(\n"
              "      southwest: LatLng(\n"
              "        pickup.latitude < destination.latitude\n"
              "            ? pickup.latitude\n"
              "            : destination.latitude,\n"
              "        pickup.longitude < destination.longitude\n"
              "            ? pickup.longitude\n"
              "            : destination.longitude,\n"
              "      ),\n"
              "      northeast: LatLng(\n"
              "        pickup.latitude > destination.latitude\n"
              "            ? pickup.latitude\n"
              "            : destination.latitude,\n"
              "        pickup.longitude > destination.longitude\n"
              "            ? pickup.longitude\n"
              "            : destination.longitude,\n"
              "      ),\n"
              "    );\n"
              "    try {\n"
              "      await controller.animateCamera(\n"
              "        CameraUpdate.newLatLngBounds(bounds, 92),\n"
              "      );\n"
              "    } catch (_) {\n"
              "      await controller.animateCamera(\n"
              "        CameraUpdate.newCameraPosition(\n"
              "          CameraPosition(target: pickup, zoom: 14),\n"
              "        ),\n"
              "      );\n"
              "    }\n"
              "  }\n\n"
              "  String get _routeLabel =>\n"
              "      '${widget.pickupAddress}  →  ${widget.destinationAddress}';\n"
          )
          select = replace_once(select, old_map_state, new_map_state, 'SelectRide map state')

          select = replace_once(
              select,
              "onMapCreated: (controller) => _mapController = controller,",
              "onMapCreated: (controller) {\n"
              "                  _mapController = controller;\n"
              "                  Future<void>.delayed(\n"
              "                    const Duration(milliseconds: 320),\n"
              "                    _fitRoute,\n"
              "                  );\n"
              "                },",
              'SelectRide map created',
          )

          old_banner = (
              "                child: const Row(\n"
              "                  children: [\n"
              "                    Icon(Icons.route_rounded, color: _accent, size: 21),\n"
              "                    SizedBox(width: 10),\n"
              "                    Expanded(\n"
              "                      child: Text(\n"
              "                        'Pickup  →  Destination',\n"
              "                        maxLines: 1,\n"
              "                        overflow: TextOverflow.ellipsis,\n"
              "                        style: TextStyle(\n"
              "                          color: _ink,\n"
              "                          fontSize: 14,\n"
              "                          fontWeight: FontWeight.w600,\n"
              "                        ),\n"
              "                      ),\n"
              "                    ),\n"
              "                  ],\n"
              "                ),\n"
          )
          new_banner = (
              "                child: Row(\n"
              "                  children: [\n"
              "                    const Icon(Icons.route_rounded, color: _accent, size: 21),\n"
              "                    const SizedBox(width: 10),\n"
              "                    Expanded(\n"
              "                      child: Text(\n"
              "                        _routeLabel,\n"
              "                        maxLines: 1,\n"
              "                        overflow: TextOverflow.ellipsis,\n"
              "                        style: const TextStyle(\n"
              "                          color: _ink,\n"
              "                          fontSize: 14,\n"
              "                          fontWeight: FontWeight.w600,\n"
              "                        ),\n"
              "                      ),\n"
              "                    ),\n"
              "                  ],\n"
              "                ),\n"
          )
          select = replace_once(select, old_banner, new_banner, 'SelectRide route banner')

          old_saved_nav = (
              "    await _persistAddressData();\n"
              "    await _moveMapToAddress(destination);\n"
              "    if (!mounted) return;\n"
              "    Navigator.push(\n"
              "      context,\n"
              "      BottomToTopTransition(const SelectRide()),\n"
              "    );\n"
          )
          new_saved_nav = (
              "    await _persistAddressData();\n"
              "    final destinationResult = await address_service.geocodeAddress(destination);\n"
              "    final pickupPosition = _currentLatLng;\n"
              "    if (destinationResult == null || pickupPosition == null || !mounted) {\n"
              "      return;\n"
              "    }\n"
              "    final destinationPosition = LatLng(\n"
              "      destinationResult.latitude,\n"
              "      destinationResult.longitude,\n"
              "    );\n"
              "    await _moveMapToAddress(destination);\n"
              "    if (!mounted) return;\n"
              "    Navigator.push(\n"
              "      context,\n"
              "      BottomToTopTransition(\n"
              "        SelectRide(\n"
              "          pickupAddress: _pickupAddress ?? 'Current location',\n"
              "          destinationAddress: destination,\n"
              "          pickupPosition: pickupPosition,\n"
              "          destinationPosition: destinationPosition,\n"
              "          stops: List<String>.from(_routeStops),\n"
              "        ),\n"
              "      ),\n"
              "    );\n"
          )
          home = replace_once(home, old_saved_nav, new_saved_nav, 'saved-place navigation')

          old_route_nav = (
              "    await _persistAddressData();\n"
              "    if (destination.isNotEmpty) {\n"
              "      await _moveMapToAddress(destination);\n"
              "      if (!mounted) return;\n"
              "      Navigator.push(\n"
              "        context,\n"
              "        BottomToTopTransition(const SelectRide()),\n"
              "      );\n"
              "    }\n"
          )
          new_route_nav = (
              "    await _persistAddressData();\n"
              "    if (destination.isNotEmpty) {\n"
              "      final destinationResult = await address_service.geocodeAddress(destination);\n"
              "      final pickupPosition = _currentLatLng;\n"
              "      if (destinationResult == null || pickupPosition == null || !mounted) {\n"
              "        return;\n"
              "      }\n"
              "      final destinationPosition = LatLng(\n"
              "        destinationResult.latitude,\n"
              "        destinationResult.longitude,\n"
              "      );\n"
              "      await _moveMapToAddress(destination);\n"
              "      if (!mounted) return;\n"
              "      Navigator.push(\n"
              "        context,\n"
              "        BottomToTopTransition(\n"
              "          SelectRide(\n"
              "            pickupAddress: pickup.isNotEmpty\n"
              "                ? pickup\n"
              "                : (_pickupAddress ?? 'Current location'),\n"
              "            destinationAddress: destination,\n"
              "            pickupPosition: pickupPosition,\n"
              "            destinationPosition: destinationPosition,\n"
              "            stops: List<String>.from(stops),\n"
              "          ),\n"
              "        ),\n"
              "      );\n"
              "    }\n"
          )
          home = replace_once(home, old_route_nav, new_route_nav, 'route-picker navigation')

          old_legacy_nav = "Navigator.push(context, RightToLeftTransition(SelectRide()));"
          new_legacy_nav = (
              "Navigator.push(\n"
              "              context,\n"
              "              RightToLeftTransition(\n"
              "                SelectRide(\n"
              "                  pickupAddress: 'Selected pickup',\n"
              "                  destinationAddress: 'Destination',\n"
              "                  pickupPosition: _initialPosition.target,\n"
              "                  destinationPosition: _initialPosition.target,\n"
              "                ),\n"
              "              ),\n"
              "            );"
          )
          legacy = replace_once(legacy, old_legacy_nav, new_legacy_nav, 'legacy SelectRide navigation')

          if 'LatLng(33.6844, 73.0479)' in select:
              raise SystemExit('hard-coded Islamabad coordinates remain in SelectRide')
          if 'Pickup  →  Destination' in select:
              raise SystemExit('generic route label remains in SelectRide')
          if 'BottomToTopTransition(const SelectRide())' in home:
              raise SystemExit('unwired SelectRide navigation remains in Home')

          home_path.write_text(home)
          select_path.write_text(select)
          legacy_path.write_text(legacy)
          PY

      - name: Format changed Dart files
        run: dart format 'lib/features/rider/home/home.dart' 'lib/features/rider/select ride/select_ride.dart' 'lib/features/rider/choose route/set on map/set_on_map.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired flow
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit repair
        run: |
          if git diff --quiet -- 'lib/features/rider/home/home.dart' 'lib/features/rider/select ride/select_ride.dart' 'lib/features/rider/choose route/set on map/set_on_map.dart'; then
            echo 'No changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'lib/features/rider/home/home.dart' 'lib/features/rider/select ride/select_ride.dart' 'lib/features/rider/choose route/set on map/set_on_map.dart'
          git commit -m 'Fix exact trip handoff to ride categories'
          git push origin HEAD:main
