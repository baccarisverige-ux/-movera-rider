name: Global E2E UAT

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - '.github/workflows/global-e2e-uat.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - '.github/workflows/global-e2e-uat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop + display deps for integration_test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop

      - name: Unit + widget suite (every feature area)
        run: flutter test

      - name: Global integration flow (booking, wallet, reservations, profile)
        run: xvfb-run -a flutter test integration_test
