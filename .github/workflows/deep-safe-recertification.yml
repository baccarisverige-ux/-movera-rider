name: Deep Safe Recertification

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop + display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb

      - run: flutter pub get
      - run: flutter config --enable-linux-desktop

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full unit + widget suite
        run: flutter test

      - name: Destructive snapshot race recertification
        run: flutter test test/ride/ride_snapshot_store_race_test.dart

      - name: Authoritative state ordering recertification
        run: flutter test test/booking/ride_session_reconcile_test.dart

      - name: Terminal realtime resync recertification
        run: flutter test test/ride/realtime_terminal_resync_test.dart

      - name: External terminal + lifecycle race recertification
        run: flutter test test/ride/waiting_external_terminal_test.dart

      - name: Parallel quote + performance budget recertification
        run: |
          flutter test test/quotes/parallel_quotes_test.dart
          flutter test test/performance/performance_budget_test.dart

      - name: Global integration flow — ride booking
        run: xvfb-run -a flutter test -d linux integration_test/ride_flow_test.dart

      - name: Full Rider lifecycle UAT
        run: xvfb-run -a flutter test -d linux integration_test/rider_full_uat_test.dart

      - name: All lifecycle path recertification
        run: xvfb-run -a flutter test -d linux integration_test/pre15_all_lifecycle_paths_test.dart

      - name: Booking, wallet, reservations and profile UAT
        run: xvfb-run -a flutter test -d linux integration_test/global_uat_flow_test.dart
