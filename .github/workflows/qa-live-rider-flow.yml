name: QA live Rider flow

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - '.github/workflows/qa-live-rider-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for this exact Pages build
        run: |
          SHORT="${GITHUB_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              BOOT=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/flutter_bootstrap.${SHORT}.js?qa_wait=$RANDOM" || true)
              if printf '%s' "$BOOT" | grep -q "main.${SHORT}.dart.js"; then
                echo "LIVE_BUILD=main.${SHORT}.dart.js" >> "$GITHUB_ENV"
                echo "Exact live build found: main.${SHORT}.dart.js"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Exact deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Exercise actual live Rider flow
        run: |
          cat > qa-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://baccarisverige-ux.github.io/-movera-rider/';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport: {width:390,height:844},
            deviceScaleFactor:1,
            isMobile:true,
            hasTouch:true,
            locale:'en-US',
            geolocation:{latitude:59.3293, longitude:18.0686},
            permissions:['geolocation'],
          });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', e => pageErrors.push({message:String(e), stack:e.stack || ''}));
          page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });

          async function shot(name) {
            await page.screenshot({path:`qa-${name}.png`, fullPage:true});
          }
          async function inputs() {
            return await page.locator('input,textarea').evaluateAll(els => els.map((el,index) => {
              const r = el.getBoundingClientRect();
              return {index, value:el.value||'', placeholder:el.getAttribute('placeholder')||'', x:r.x,y:r.y,w:r.width,h:r.height, visible:r.width>0&&r.height>0};
            }));
          }
          async function dump(name, extra={}) {
            const data = {name, url:page.url(), inputs:await inputs(), pageErrors:[...pageErrors], consoleErrors:[...consoleErrors], ...extra};
            fs.writeFileSync(`qa-${name}.json`, JSON.stringify(data,null,2));
            console.log(`STATE ${name}\n`+JSON.stringify(data,null,2));
          }
          function fatalErrors() {
            return [...pageErrors.map(x=>x.message), ...consoleErrors].filter(x => /Null check operator|RangeError|Another exception|Uncaught|TypeError/i.test(x));
          }

          await page.goto(base+`?v=${Date.now()}`, {waitUntil:'networkidle', timeout:120000});
          await page.waitForTimeout(5000);
          await dump('home');
          await shot('home');
          if (fatalErrors().length) throw new Error('Fatal runtime error on Home: '+fatalErrors().join(' | '));

          // Verify the exact production address functions before using the UI.
          const geo = await page.evaluate(async () => {
            const raw = await window.moveraGeocodeAddress('Stockholm Central Station');
            let forward = null;
            try { forward = raw ? JSON.parse(raw) : null; } catch (_) {}
            const reverse = await window.moveraReverseGeocode(59.3293, 18.0686);
            return {forward, reverse};
          });
          await dump('geocoding', {geo});
          if (!geo.forward || !Number.isFinite(Number(geo.forward.latitude)) || !Number.isFinite(Number(geo.forward.longitude))) {
            throw new Error('Live forward geocoding failed');
          }
          if (!geo.reverse || !String(geo.reverse).trim()) {
            throw new Error('Live reverse geocoding failed');
          }

          // Flutter canvas semantics are empty in this production build. Drive
          // the same mobile controls a rider taps, using the verified 390x844
          // viewport. This is the real Pages app, not a local harness.
          await page.mouse.click(190, 708); // Home "Where to?"
          await page.waitForTimeout(1200);
          await dump('route-open');
          await shot('route-open');

          let visibleInputs = page.locator('input,textarea').filter({visible:true});
          let count = await visibleInputs.count().catch(()=>0);
          if (!count) {
            // Destination row in the route planner.
            await page.mouse.click(185, 274);
            await page.waitForTimeout(400);
            visibleInputs = page.locator('input,textarea');
            count = await visibleInputs.count();
          }
          if (!count) throw new Error('Route planner destination input did not become editable');

          const target = visibleInputs.nth(count - 1);
          await target.fill('Stockholm Central Station');
          await page.waitForTimeout(700);
          await dump('route-filled');
          await shot('route-filled');

          // Next is the bottom action of the 92%-height route sheet.
          await page.mouse.click(195, 804);
          await page.waitForTimeout(3500);
          await dump('pickup-picker');
          await shot('pickup-picker');

          // Exact pickup picker confirms current map position. Wait until its
          // reverse lookup has had time to complete, then press its bottom CTA.
          await page.waitForTimeout(3500);
          await page.mouse.click(195, 797);
          await page.waitForTimeout(7000);
          await dump('after-pickup-confirm');
          await shot('after-pickup-confirm');

          if (fatalErrors().length) {
            throw new Error('Fatal runtime error in live Rider route flow: '+fatalErrors().join(' | '));
          }

          console.log('PASS: exact live Rider build completed production geocoding and route interaction without fatal runtime errors');
          await browser.close();
          JS
          node qa-live.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-rider-flow
          path: |
            qa-*.png
            qa-*.json
          if-no-files-found: warn
