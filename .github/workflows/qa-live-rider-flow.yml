name: QA live Rider flow

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - '.github/workflows/qa-live-rider-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for this exact Pages build
        run: |
          SHORT="${GITHUB_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              BOOT=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/flutter_bootstrap.${SHORT}.js?qa_wait=$RANDOM" || true)
              if printf '%s' "$BOOT" | grep -q "main.${SHORT}.dart.js"; then
                echo "LIVE_BUILD=main.${SHORT}.dart.js" >> "$GITHUB_ENV"
                echo "Exact live build found: main.${SHORT}.dart.js"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Exact deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Exercise actual live Rider flow
        run: |
          cat > qa-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://baccarisverige-ux.github.io/-movera-rider/';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport: {width:390,height:844},
            deviceScaleFactor:1,
            isMobile:true,
            hasTouch:true,
            locale:'en-US',
            geolocation:{latitude:59.3293, longitude:18.0686},
            permissions:['geolocation'],
          });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', e => pageErrors.push({message:String(e), stack:e.stack || ''}));
          page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });

          async function shot(name) {
            await page.screenshot({path:`qa-${name}.png`, fullPage:true});
          }
          async function semantics() {
            return await page.evaluate(() => Array.from(document.querySelectorAll('flt-semantics')).map((el,index) => {
              const r = el.getBoundingClientRect();
              return {index, text:(el.textContent||'').trim(), label:el.getAttribute('aria-label')||'', role:el.getAttribute('role')||'', x:r.x,y:r.y,w:r.width,h:r.height};
            }).filter(x => x.text || x.label || x.role));
          }
          async function enableSemantics() {
            const p = page.locator('flt-semantics-placeholder');
            if (await p.count()) {
              await p.first().click({force:true}).catch(()=>{});
              await page.waitForTimeout(800);
            }
          }
          async function findSemantic(rx) {
            return await page.evaluate((src) => {
              const re = new RegExp(src,'i');
              for (const el of Array.from(document.querySelectorAll('flt-semantics'))) {
                const text = `${el.getAttribute('aria-label')||''} ${el.textContent||''}`.trim();
                const r = el.getBoundingClientRect();
                if (re.test(text) && r.width>0 && r.height>0) return {text, x:r.x+r.width/2, y:r.y+r.height/2};
              }
              return null;
            }, rx.source);
          }
          async function clickSemantic(rx) {
            const hit = await findSemantic(rx);
            if (!hit) return false;
            await page.mouse.click(hit.x, hit.y);
            await page.waitForTimeout(700);
            return true;
          }
          async function dump(name) {
            const data = {name, url:page.url(), semantics:await semantics(), pageErrors:[...pageErrors], consoleErrors:[...consoleErrors]};
            fs.writeFileSync(`qa-${name}.json`, JSON.stringify(data,null,2));
            console.log(`STATE ${name}\n`+JSON.stringify(data,null,2));
          }
          function fatalErrors() {
            return [...pageErrors.map(x=>x.message), ...consoleErrors].filter(x => /Null check operator|RangeError|Another exception|Uncaught|TypeError/i.test(x));
          }

          await page.goto(base+`?v=${Date.now()}`, {waitUntil:'networkidle', timeout:120000});
          await page.waitForTimeout(5000);
          await enableSemantics();
          await dump('home');
          await shot('home');
          if (fatalErrors().length) throw new Error('Fatal runtime error on Home: '+fatalErrors().join(' | '));

          let opened = await clickSemantic(/Where to\?/i);
          if (!opened) opened = await clickSemantic(/destination/i);
          await dump('destination-open');
          await shot('destination-open');

          const inputs = page.locator('input,textarea');
          let target = null;
          for (let i=0;i<await inputs.count();i++) {
            const el = inputs.nth(i);
            if (await el.isVisible().catch(()=>false)) target = el;
          }
          if (target) {
            await target.fill('Stockholm Central Station');
            await page.waitForTimeout(1800);
            await target.press('ArrowDown').catch(()=>{});
            await target.press('Enter').catch(()=>{});
            await page.waitForTimeout(2000);
          }
          await dump('destination-entered');
          await shot('destination-entered');

          if (!await findSemantic(/Next/i)) {
            const candidates = await semantics();
            const suggestion = candidates.find(x => /Stockholm|Central/i.test(`${x.label} ${x.text}`) && x.h>20);
            if (suggestion) {
              await page.mouse.click(suggestion.x+suggestion.w/2, suggestion.y+suggestion.h/2);
              await page.waitForTimeout(1000);
            }
          }

          if (!await clickSemantic(/Next/i)) {
            await dump('next-missing');
            throw new Error('Next is not clickable in actual live Rider flow');
          }
          await page.waitForTimeout(3500);
          await enableSemantics();
          await dump('after-next');
          await shot('after-next');

          if (!await findSemantic(/Choose your ride/i)) {
            throw new Error('Choose your ride is not visible after actual live flow');
          }

          for (const label of [/Mini Ride/i,/Eco-Friendly/i,/XL/i,/Luxury/i]) {
            if (!await clickSemantic(label)) throw new Error(`Category not clickable: ${label}`);
          }

          if (!await clickSemantic(/Payment/i)) throw new Error('Payment control not clickable');
          await page.waitForTimeout(600);
          await enableSemantics();
          if (!await findSemantic(/Payment method/i)) throw new Error('Payment sheet did not open');
          if (!await clickSemantic(/Cash/i)) throw new Error('Cash payment option not clickable');

          if (!await clickSemantic(/Pickup time/i)) throw new Error('Pickup time control not clickable');
          await page.waitForTimeout(600);
          await enableSemantics();
          if (!await findSemantic(/When do you want to ride/i)) throw new Error('Booking picker did not open');
          if (!await clickSemantic(/Book now/i)) throw new Error('Book now not clickable');

          await dump('categories-tested');
          await shot('categories-tested');
          if (fatalErrors().length) throw new Error('Fatal runtime errors after categories interactions: '+fatalErrors().join(' | '));

          console.log('PASS: actual live Rider reached categories and core controls worked without fatal runtime errors');
          await browser.close();
          JS
          node qa-live.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-rider-flow
          path: |
            qa-*.png
            qa-*.json
          if-no-files-found: warn
