name: QA live Rider flow

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - '.github/workflows/qa-live-rider-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for this exact Pages build
        run: |
          SHORT="${GITHUB_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              BOOT=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/flutter_bootstrap.${SHORT}.js?qa_wait=$RANDOM" || true)
              if printf '%s' "$BOOT" | grep -q "main.${SHORT}.dart.js"; then
                echo "LIVE_BUILD=main.${SHORT}.dart.js" >> "$GITHUB_ENV"
                echo "Exact live build found: main.${SHORT}.dart.js"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Exact deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Exercise actual live Rider flow
        run: |
          cat > qa-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base='https://baccarisverige-ux.github.io/-movera-rider/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,locale:'en-US',geolocation:{latitude:59.3293,longitude:18.0686},permissions:['geolocation']});
          const page=await context.newPage();
          const cdp=await context.newCDPSession(page);
          const pageErrors=[]; const consoleErrors=[];
          page.on('pageerror',e=>pageErrors.push({message:String(e),stack:e.stack||''}));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());});
          async function shot(name){return await page.screenshot({path:`qa-${name}.png`,fullPage:true});}
          async function panelCrop(name){return await page.screenshot({path:`qa-${name}-panel.png`,clip:{x:0,y:500,width:390,height:344}});}
          async function touchSwipe(x,fromY,toY,steps=18){
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y:fromY,radiusX:8,radiusY:8,force:1}]});
            for(let i=1;i<=steps;i++){const y=fromY+(toY-fromY)*(i/steps);await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y,radiusX:8,radiusY:8,force:1}]});await page.waitForTimeout(18);}
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]}); await page.waitForTimeout(900);
          }
          async function inputs(){return await page.locator('input,textarea').evaluateAll(els=>els.map((el,index)=>{const r=el.getBoundingClientRect();return{index,value:el.value||'',placeholder:el.getAttribute('placeholder')||'',x:r.x,y:r.y,w:r.width,h:r.height,visible:r.width>0&&r.height>0};}));}
          async function dump(name,extra={}){const data={name,url:page.url(),inputs:await inputs(),pageErrors:[...pageErrors],consoleErrors:[...consoleErrors],...extra};fs.writeFileSync(`qa-${name}.json`,JSON.stringify(data,null,2));console.log(`STATE ${name}\n`+JSON.stringify(data,null,2));}
          function fatalErrors(){return[...pageErrors.map(x=>x.message),...consoleErrors].filter(x=>/Null check operator|RangeError|Another exception|Uncaught|TypeError|Assertion failed/i.test(x));}
          function requireChanged(a,b,label){if(Buffer.compare(a,b)===0)throw new Error(`${label} produced no live UI change`);}

          await page.goto(base+`?v=${Date.now()}`,{waitUntil:'networkidle',timeout:120000}); await page.waitForTimeout(5000); await dump('home'); const home=await shot('home');
          if(fatalErrors().length)throw new Error('Fatal runtime error on Home: '+fatalErrors().join(' | '));
          await page.mouse.click(28,56);await page.waitForTimeout(900);await shot('menu-open');
          if(fatalErrors().length)throw new Error('Fatal runtime error opening menu: '+fatalErrors().join(' | '));
          await page.mouse.click(120,210);await page.waitForTimeout(1200);await shot('history');
          if(fatalErrors().length)throw new Error('Fatal runtime error on Ride History: '+fatalErrors().join(' | '));
          await page.mouse.click(28,56);await page.waitForTimeout(700);
          await page.mouse.click(28,56);await page.waitForTimeout(900);await page.mouse.click(120,455);await page.waitForTimeout(1200);await shot('support');
          if(fatalErrors().length)throw new Error('Fatal runtime error on Support: '+fatalErrors().join(' | '));
          await page.mouse.click(28,56);await page.waitForTimeout(700);
          await page.goto(base+`?v=${Date.now()}`,{waitUntil:'networkidle',timeout:120000}); await page.waitForTimeout(4000);
          const geo=await page.evaluate(async()=>{const raw=await window.moveraGeocodeAddress('Stockholm Central Station');let forward=null;try{forward=raw?JSON.parse(raw):null;}catch(_){}const reverse=await window.moveraReverseGeocode(59.3293,18.0686);return{forward,reverse};}); await dump('geocoding',{geo});
          if(!geo.forward||!Number.isFinite(Number(geo.forward.latitude))||!Number.isFinite(Number(geo.forward.longitude)))throw new Error('Live forward geocoding failed'); if(!geo.reverse||!String(geo.reverse).trim())throw new Error('Live reverse geocoding failed');

          await page.mouse.click(190,708);await page.waitForTimeout(1200);await shot('route-open');
          let visibleInputs=page.locator('input,textarea').filter({visible:true});let count=await visibleInputs.count().catch(()=>0);if(!count){await page.mouse.click(185,274);await page.waitForTimeout(400);visibleInputs=page.locator('input,textarea');count=await visibleInputs.count();}if(!count)throw new Error('Route planner destination input did not become editable');
          await visibleInputs.nth(count-1).fill('Stockholm Central Station');await page.waitForTimeout(700);await shot('route-filled');
          await page.mouse.click(195,804);await page.waitForTimeout(3500);await shot('pickup-picker');await page.waitForTimeout(3500);await page.mouse.click(195,797);await page.waitForTimeout(7000);await dump('after-pickup-confirm');
          const categoriesInitial=await shot('after-pickup-confirm');if(fatalErrors().length)throw new Error('Fatal runtime error entering categories: '+fatalErrors().join(' | '));
          await touchSwipe(195,640,240,24);await page.waitForTimeout(700);const categoriesExpanded=await shot('categories-expanded');

          const ridePoints=[['mini',195,360],['eco',195,440],['xl',195,520],['luxury',195,600]];let previous=categoriesExpanded;for(const[name,x,y]of ridePoints){await page.mouse.click(x,y);await page.waitForTimeout(450);const current=await shot(`ride-${name}`);requireChanged(previous,current,`Ride category ${name}`);previous=current;if(fatalErrors().length)throw new Error(`Fatal runtime error selecting ${name}: `+fatalErrors().join(' | '));}
          await page.mouse.click(50,677);await page.waitForTimeout(350);const fareDown=await shot('fare-down');
          await page.mouse.click(340,677);await page.waitForTimeout(350);const fareUp=await shot('fare-up');
          await page.mouse.click(104,743);await page.waitForTimeout(650);const paymentOpen=await shot('payment-open');requireChanged(fareUp,paymentOpen,'Payment sheet');await page.mouse.click(195,548);await page.waitForTimeout(650);const paymentCash=await shot('payment-cash');requireChanged(paymentOpen,paymentCash,'Cash payment selection');if(fatalErrors().length)throw new Error('Fatal runtime error changing payment: '+fatalErrors().join(' | '));

          const panelBefore=await panelCrop('panel-before-swipe');await touchSwipe(195,450,220,20);const panelAfter=await panelCrop('panel-after-swipe');const scrolled=await shot('categories-touch-scrolled');
          await page.mouse.click(285,743);await page.waitForTimeout(750);const bookingSheet=await shot('pickup-time-sheet');requireChanged(scrolled,bookingSheet,'Pickup time bottom sheet');
          await page.mouse.click(195,702);await page.waitForTimeout(700);const afterBookNow=await shot('after-book-now');requireChanged(bookingSheet,afterBookNow,'Book now selection');
          await page.mouse.click(285,743);await page.waitForTimeout(650);const bookingSheetAgain=await shot('pickup-time-sheet-again');requireChanged(afterBookNow,bookingSheetAgain,'Pickup time sheet reopen');
          await page.mouse.click(195,778);await page.waitForTimeout(1200);const laterPicker=await shot('book-for-later-picker');requireChanged(bookingSheetAgain,laterPicker,'Book for later picker');
          await page.mouse.click(338,680);await page.waitForTimeout(900);const timePicker=await shot('book-for-later-time-picker');requireChanged(laterPicker,timePicker,'Book for later time picker');

          // Confirm the default future pickup time in the actual production time picker.
          await page.mouse.click(322,630);await page.waitForTimeout(1000);const scheduled=await shot('scheduled-ride');requireChanged(timePicker,scheduled,'Scheduled ride confirmation');await dump('scheduled-ride');
          if(fatalErrors().length)throw new Error('Fatal runtime error scheduling ride: '+fatalErrors().join(' | '));

          // The pinned production footer keeps the final CTA visible at the bottom.
          await page.mouse.click(195,808);await page.waitForTimeout(5000);const findingDrivers=await shot('after-final-booking-cta');requireChanged(scheduled,findingDrivers,'Final booking CTA');await dump('after-final-booking-cta');
          if(fatalErrors().length)throw new Error('Fatal runtime error after final booking CTA: '+fatalErrors().join(' | '));

          console.log('PASS: exact live Rider completed route entry, all ride types, fare controls, Cash payment, Book now, Book for later date/time confirmation, and final booking transition with no fatal runtime errors');
          await browser.close();
          JS
          node qa-live.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-rider-flow
          path: |
            qa-*.png
            qa-*.json
          if-no-files-found: warn
