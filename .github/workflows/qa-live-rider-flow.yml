name: QA live Rider flow

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - '.github/workflows/qa-live-rider-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for this exact Pages build
        run: |
          SHORT="${GITHUB_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              BOOT=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/flutter_bootstrap.${SHORT}.js?qa_wait=$RANDOM" || true)
              if printf '%s' "$BOOT" | grep -q "main.${SHORT}.dart.js"; then
                echo "LIVE_BUILD=main.${SHORT}.dart.js" >> "$GITHUB_ENV"
                echo "Exact live build found: main.${SHORT}.dart.js"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Exact deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Exercise actual live Rider flow
        run: |
          cat > qa-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://baccarisverige-ux.github.io/-movera-rider/';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport: {width:390,height:844},
            deviceScaleFactor:1,
            isMobile:true,
            hasTouch:true,
            locale:'en-US',
            geolocation:{latitude:59.3293, longitude:18.0686},
            permissions:['geolocation'],
          });
          const page = await context.newPage();
          const cdp = await context.newCDPSession(page);
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', e => pageErrors.push({message:String(e), stack:e.stack || ''}));
          page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });

          async function shot(name) {
            return await page.screenshot({path:`qa-${name}.png`, fullPage:true});
          }
          async function panelCrop(name) {
            return await page.screenshot({path:`qa-${name}-panel.png`, clip:{x:0,y:500,width:390,height:344}});
          }
          async function touchSwipe(x, fromY, toY, steps=18) {
            await cdp.send('Input.dispatchTouchEvent', {type:'touchStart', touchPoints:[{x, y:fromY, radiusX:8, radiusY:8, force:1}]});
            for (let i=1;i<=steps;i++) {
              const y = fromY + (toY-fromY)*(i/steps);
              await cdp.send('Input.dispatchTouchEvent', {type:'touchMove', touchPoints:[{x, y, radiusX:8, radiusY:8, force:1}]});
              await page.waitForTimeout(18);
            }
            await cdp.send('Input.dispatchTouchEvent', {type:'touchEnd', touchPoints:[]});
            await page.waitForTimeout(900);
          }
          async function inputs() {
            return await page.locator('input,textarea').evaluateAll(els => els.map((el,index) => {
              const r = el.getBoundingClientRect();
              return {index, value:el.value||'', placeholder:el.getAttribute('placeholder')||'', x:r.x,y:r.y,w:r.width,h:r.height, visible:r.width>0&&r.height>0};
            }));
          }
          async function dump(name, extra={}) {
            const data = {name, url:page.url(), inputs:await inputs(), pageErrors:[...pageErrors], consoleErrors:[...consoleErrors], ...extra};
            fs.writeFileSync(`qa-${name}.json`, JSON.stringify(data,null,2));
            console.log(`STATE ${name}\n`+JSON.stringify(data,null,2));
          }
          function fatalErrors() {
            return [...pageErrors.map(x=>x.message), ...consoleErrors].filter(x => /Null check operator|RangeError|Another exception|Uncaught|TypeError|Assertion failed/i.test(x));
          }
          function requireChanged(before, after, label) {
            if (Buffer.compare(before, after) === 0) throw new Error(`${label} produced no live UI change`);
          }

          await page.goto(base+`?v=${Date.now()}`, {waitUntil:'networkidle', timeout:120000});
          await page.waitForTimeout(5000);
          await dump('home');
          await shot('home');
          if (fatalErrors().length) throw new Error('Fatal runtime error on Home: '+fatalErrors().join(' | '));

          const geo = await page.evaluate(async () => {
            const raw = await window.moveraGeocodeAddress('Stockholm Central Station');
            let forward = null;
            try { forward = raw ? JSON.parse(raw) : null; } catch (_) {}
            const reverse = await window.moveraReverseGeocode(59.3293, 18.0686);
            return {forward, reverse};
          });
          await dump('geocoding', {geo});
          if (!geo.forward || !Number.isFinite(Number(geo.forward.latitude)) || !Number.isFinite(Number(geo.forward.longitude))) throw new Error('Live forward geocoding failed');
          if (!geo.reverse || !String(geo.reverse).trim()) throw new Error('Live reverse geocoding failed');

          await page.mouse.click(190, 708);
          await page.waitForTimeout(1200);
          await shot('route-open');

          let visibleInputs = page.locator('input,textarea').filter({visible:true});
          let count = await visibleInputs.count().catch(()=>0);
          if (!count) {
            await page.mouse.click(185, 274);
            await page.waitForTimeout(400);
            visibleInputs = page.locator('input,textarea');
            count = await visibleInputs.count();
          }
          if (!count) throw new Error('Route planner destination input did not become editable');

          const target = visibleInputs.nth(count - 1);
          await target.fill('Stockholm Central Station');
          await page.waitForTimeout(700);
          await shot('route-filled');

          await page.mouse.click(195, 804);
          await page.waitForTimeout(3500);
          await shot('pickup-picker');
          await page.waitForTimeout(3500);
          await page.mouse.click(195, 797);
          await page.waitForTimeout(7000);
          await dump('after-pickup-confirm');
          const categoriesInitial = await shot('after-pickup-confirm');
          if (fatalErrors().length) throw new Error('Fatal runtime error entering categories: '+fatalErrors().join(' | '));

          const ridePoints = [
            ['mini', 195, 281],
            ['eco', 195, 380],
            ['xl', 195, 478],
            ['luxury', 195, 575],
          ];
          let previous = categoriesInitial;
          for (const [name, x, y] of ridePoints) {
            await page.mouse.click(x, y);
            await page.waitForTimeout(450);
            const current = await shot(`ride-${name}`);
            requireChanged(previous, current, `Ride category ${name}`);
            previous = current;
            if (fatalErrors().length) throw new Error(`Fatal runtime error selecting ${name}: `+fatalErrors().join(' | '));
          }

          await page.mouse.click(50, 708);
          await page.waitForTimeout(350);
          const fareDown = await shot('fare-down');
          requireChanged(previous, fareDown, 'Fare decrease');
          await page.mouse.click(340, 708);
          await page.waitForTimeout(350);
          const fareUp = await shot('fare-up');
          requireChanged(fareDown, fareUp, 'Fare increase');

          await page.mouse.click(195, 790);
          await page.waitForTimeout(650);
          const paymentOpen = await shot('payment-open');
          requireChanged(fareUp, paymentOpen, 'Payment sheet');
          await page.mouse.click(195, 548);
          await page.waitForTimeout(650);
          const paymentCash = await shot('payment-cash');
          requireChanged(paymentOpen, paymentCash, 'Cash payment selection');
          if (fatalErrors().length) throw new Error('Fatal runtime error changing payment: '+fatalErrors().join(' | '));

          const panelBefore = await panelCrop('panel-before-swipe');
          await touchSwipe(195, 800, 410, 20);
          const panelAfter = await panelCrop('panel-after-swipe');
          requireChanged(panelBefore, panelAfter, 'Touch swipe inside ride panel');
          await dump('categories-touch-scrolled');
          await shot('categories-touch-scrolled');

          if (fatalErrors().length) throw new Error('Fatal runtime error after real touch swipe: '+fatalErrors().join(' | '));
          console.log('PASS: live Rider route, categories, fare, payment and real touch-panel scrolling worked without fatal runtime errors');
          await browser.close();
          JS
          node qa-live.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-rider-flow
          path: |
            qa-*.png
            qa-*.json
          if-no-files-found: warn
