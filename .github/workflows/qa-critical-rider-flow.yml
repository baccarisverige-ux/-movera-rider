name: QA critical Rider flow

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - '.github/workflows/qa-critical-rider-flow.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-critical-rider-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-rider-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for target Pages build
        env:
          TARGET_LIVE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          SHORT="${TARGET_LIVE_SHA::8}"
          for i in $(seq 1 48); do
            HTML=$(curl -fsSL -H 'Cache-Control: no-cache' "https://baccarisverige-ux.github.io/-movera-rider/?qa_wait=$RANDOM" || true)
            if printf '%s' "$HTML" | grep -q "flutter_bootstrap.${SHORT}.js"; then
              echo "LIVE_BUILD=$SHORT" >> "$GITHUB_ENV"
              echo "Testing live Pages build $SHORT"
              exit 0
            fi
            sleep 10
          done
          echo "Target deployed bundle for $SHORT was not found" >&2
          exit 1

      - name: Payment, Finding to Waiting, standalone Cancel, and standalone Wallet
        run: |
          cat > qa-critical.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const base = 'https://baccarisverige-ux.github.io/-movera-rider/';

          async function enableA11y(page) {
            try { await page.getByLabel('Enable accessibility').click({ timeout: 2500 }); } catch (_) {}
            await page.waitForTimeout(400);
          }

          async function waitOwner(page, expected, label, timeout = 15000) {
            await page.waitForFunction(
              owner => window.moveraMapOwner === owner,
              expected,
              { timeout },
            ).catch(async error => {
              const actual = await page.evaluate(() => window.moveraMapOwner || 'none');
              throw new Error(`${label}: expected map owner ${expected}, got ${actual}`, { cause: error });
            });
          }

          async function newContext(browser, { standalone = false } = {}) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'en-US',
              geolocation: { latitude: 59.33258, longitude: 18.0649 },
              permissions: ['geolocation'],
            });
            if (standalone) {
              await context.addInitScript(() => {
                Object.defineProperty(navigator, 'standalone', {
                  configurable: true,
                  get: () => true,
                });
              });
            }
            return context;
          }

          async function openHome(page, name) {
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            await page.goto(base + `?critical=${name}&v=${Date.now()}`, {
              waitUntil: 'networkidle',
              timeout: 120000,
            });
            await page.waitForTimeout(4500);
            await enableA11y(page);
            if (errors.length) throw new Error(`${name}: page errors: ${errors.join(' | ')}`);
          }

          async function openSelection(page, name) {
            await openHome(page, name);
            const where = page.getByText('Where to', { exact: false });
            if (await where.count()) await where.last().click();
            else await page.mouse.click(190, 708);
            await page.waitForTimeout(1200);
            await page.screenshot({ path: `qa-critical-${name}-destination.png`, fullPage: true });

            let inputs = page.locator(
              'input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible',
            );
            let count = await inputs.count().catch(() => 0);
            if (!count) {
              await page.mouse.click(185, 274);
              await page.waitForTimeout(400);
              inputs = page.locator(
                'input:not([type="submit"]):not([type="hidden"]):visible, textarea:visible',
              );
              count = await inputs.count();
            }
            if (!count) throw new Error(`${name}: visible destination input missing`);
            await inputs.last().pressSequentially('Stockholm Central Station', { delay: 10 });
            await page.waitForTimeout(700);

            const next = page.getByText('Next', { exact: true });
            if (await next.count()) await next.last().click();
            else await page.mouse.click(195, 804);
            await page.waitForTimeout(3500);
            await page.screenshot({ path: `qa-critical-${name}-pickup.png`, fullPage: true });
            await waitOwner(page, 'pickup', `${name}: pickup`);

            await page.mouse.click(195, 797);
            await page.waitForTimeout(7000);
            await page.screenshot({ path: `qa-critical-${name}-selection.png`, fullPage: true });
            await waitOwner(page, 'select_ride', `${name}: selection`);
          }

          async function enterFinding(page, name) {
            await openSelection(page, name);
            const select = page.getByText('Select Movera', { exact: true });
            if (await select.count()) await select.last().click();
            else {
              await page.mouse.click(195, 808);
              await page.waitForTimeout(900);
              await page.mouse.click(195, 808);
            }
            await waitOwner(page, 'finding', `${name}: finding`, 15000);
            await page.screenshot({ path: `qa-critical-${name}-finding.png`, fullPage: true });
          }

          async function openWallet(page, name) {
            await openHome(page, name);
            const menu = page.getByLabel('Menu');
            if (!(await menu.count())) throw new Error(`${name}: Menu control missing`);
            await menu.last().click();
            const wallet = page.getByText('Wallet', { exact: true });
            await wallet.last().waitFor({ state: 'visible', timeout: 5000 });
            await wallet.last().click();
            await page.getByText('Available balance', { exact: true }).waitFor({ state: 'visible', timeout: 7000 });
          }

          async function visibleBalance(page) {
            const values = await page.getByText(/^kr\s+\d+(?:\.\d+)?$/).allTextContents();
            const parsed = values
              .map(value => Number(value.replace(/[^0-9.]/g, '')))
              .filter(value => Number.isFinite(value));
            if (!parsed.length) throw new Error('Wallet: visible balance missing');
            return parsed[0];
          }

          async function paymentPickerVisible(page) {
            return page.getByText('PAYMENT METHODS', { exact: true }).isVisible().catch(() => false);
          }

          async function openPaymentPicker(page, label) {
            const attempts = [
              async () => page.touchscreen.tap(350, 666),
              async () => page.mouse.click(350, 666),
              async () => page.touchscreen.tap(190, 666),
              async () => page.mouse.click(190, 666),
            ];
            for (let i = 0; i < attempts.length; i++) {
              await attempts[i]();
              await page.waitForTimeout(800);
              if (await paymentPickerVisible(page)) return;
            }
            await page.screenshot({ path: `qa-critical-${label}-picker-failed.png`, fullPage: true });
            throw new Error(`${label}: Payment row did not open the real picker`);
          }

          const browser = await chromium.launch({ headless: true });
          const evidence = {};

          // 1. Payment must open the actual picker and retain a selected method.
          {
            const context = await newContext(browser);
            const page = await context.newPage();
            await openSelection(page, 'payment');
            await page.screenshot({ path: 'qa-critical-payment-before.png', fullPage: true });
            await openPaymentPicker(page, 'payment');
            await page.getByText('Payment', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('PAYMENT METHODS', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            const cash = page.getByText('Cash', { exact: true });
            await cash.last().waitFor({ state: 'visible', timeout: 5000 });
            await page.screenshot({ path: 'qa-critical-payment-picker.png', fullPage: true });
            await cash.last().click();
            await page.getByText('PAYMENT METHODS', { exact: true }).waitFor({ state: 'hidden', timeout: 5000 });
            await page.screenshot({ path: 'qa-critical-payment-cash.png', fullPage: true });
            await openPaymentPicker(page, 'payment-reopen');
            const defaults = await page.getByText('Default for rides', { exact: true }).count();
            if (defaults !== 1) throw new Error(`Payment: expected exactly one default method, got ${defaults}`);
            if (!(await page.getByText('Cash', { exact: true }).count())) {
              throw new Error('Payment: Cash missing after selecting it');
            }
            evidence.payment = 'pass';
            await context.close();
          }

          // 2. Finding must really transition to Waiting after the 25 s mock assignment.
          {
            const context = await newContext(browser);
            const page = await context.newPage();
            await enterFinding(page, 'waiting');
            await waitOwner(page, 'waiting', 'Finding to Waiting', 45000);
            const owner = await page.evaluate(() => window.moveraMapOwner || 'none');
            if (owner !== 'waiting') throw new Error(`Finding to Waiting: got ${owner}`);
            await page.screenshot({ path: 'qa-critical-waiting.png', fullPage: true });
            evidence.waiting = owner;
            await context.close();
          }

          // 3. Real cancel in standalone/Home-Screen mode must end on Home and stay there.
          {
            const context = await newContext(browser, { standalone: true });
            const page = await context.newPage();
            await enterFinding(page, 'cancel-standalone');
            const cancelEntry = page.getByLabel('Collapse');
            if (!(await cancelEntry.count())) throw new Error('Cancel: Finding control missing');
            await cancelEntry.last().click();
            await page.getByText('Cancel ride?', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('Cancel request', { exact: true }).click();
            await page.getByText('Why are you cancelling?', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('Skip', { exact: true }).click();
            await page.getByText('Where to', { exact: false }).last().waitFor({ state: 'visible', timeout: 10000 });
            await page.waitForTimeout(28000);
            const owner = await page.evaluate(() => window.moveraMapOwner || 'none');
            if (owner === 'finding' || owner === 'waiting') {
              throw new Error(`Cancel: ride resurrected after cancellation (${owner})`);
            }
            if (await page.getByText('Finding your driver', { exact: true }).count()) {
              throw new Error('Cancel: Finding UI returned after cancellation');
            }
            await page.screenshot({ path: 'qa-critical-cancel-home.png', fullPage: true });
            evidence.cancel = { standalone: true, owner };
            await context.close();
          }

          // 4. Wallet Add funds in standalone mode: top up, persist after reload,
          // and prove reopening/dismissing the sheet does not corrupt the balance.
          {
            const context = await newContext(browser, { standalone: true });
            const page = await context.newPage();
            await openWallet(page, 'wallet-standalone');
            const before = await visibleBalance(page);
            const addFunds = page.getByText('Add funds', { exact: true });
            await addFunds.last().click();
            await page.getByText('PAY WITH', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.getByText('kr 100', { exact: true }).click();
            await page.getByText('Card', { exact: true }).click();
            await page.getByText('PAY WITH', { exact: true }).waitFor({ state: 'hidden', timeout: 7000 });
            await page.waitForTimeout(1200);
            const after = await visibleBalance(page);
            if (after !== before + 100) {
              throw new Error(`Wallet: expected ${before + 100} after top-up, got ${after}`);
            }
            await page.screenshot({ path: 'qa-critical-wallet-funded.png', fullPage: true });

            await page.reload({ waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(4500);
            await enableA11y(page);
            const menu = page.getByLabel('Menu');
            await menu.last().click();
            const wallet = page.getByText('Wallet', { exact: true });
            await wallet.last().waitFor({ state: 'visible', timeout: 5000 });
            await wallet.last().click();
            await page.getByText('Available balance', { exact: true }).waitFor({ state: 'visible', timeout: 7000 });
            const persisted = await visibleBalance(page);
            if (persisted !== after) {
              throw new Error(`Wallet: balance did not persist after standalone reload (${after} -> ${persisted})`);
            }

            const addAgain = page.getByText('Add funds', { exact: true });
            await addAgain.last().click();
            await page.getByText('PAY WITH', { exact: true }).waitFor({ state: 'visible', timeout: 5000 });
            await page.keyboard.press('Escape');
            await page.getByText('PAY WITH', { exact: true }).waitFor({ state: 'hidden', timeout: 5000 });
            const afterDismiss = await visibleBalance(page);
            if (afterDismiss !== persisted) {
              throw new Error(`Wallet: dismiss changed balance (${persisted} -> ${afterDismiss})`);
            }
            await page.screenshot({ path: 'qa-critical-wallet-persisted.png', fullPage: true });
            evidence.wallet = { standalone: true, before, after, persisted, afterDismiss };
            await context.close();
          }

          fs.writeFileSync('qa-critical-result.json', JSON.stringify(evidence, null, 2));
          await browser.close();
          console.log('PASS: Payment picker, Finding to Waiting, standalone Cancel, and standalone Wallet Add funds');
          JS
          node qa-critical.mjs

      - name: Upload critical-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-critical-rider-flow
          path: |
            qa-critical-*.png
            qa-critical-*.json
          if-no-files-found: warn
