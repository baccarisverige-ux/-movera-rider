name: Batch 5 Phase 69 Test Integrity

on:
  push:
    branches: [main]
    paths:
      - 'test/**'
      - '.github/workflows/batch5-phase69-test-integrity.yml'
  pull_request:
    paths:
      - 'test/**'
      - '.github/workflows/batch5-phase69-test-integrity.yml'
  workflow_dispatch:

jobs:
  journey-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the six real Rider journeys
        shell: bash
        run: |
          set -euo pipefail
          required=(
            test/journeys/book_to_home_test.dart
            test/journeys/catalog_failure_test.dart
            test/journeys/driver_cancel_research_test.dart
            test/journeys/reservation_journey_test.dart
            test/journeys/resume_mid_ride_test.dart
            test/journeys/rider_cancel_test.dart
          )
          for file in "${required[@]}"; do
            test -f "$file" || {
              echo "::error::Missing required Phase 69 journey: $file"
              exit 1
            }
          done

      - name: Reject the retired source-topology suite
        shell: bash
        run: |
          set -euo pipefail
          test ! -e test/ride/ride_navigation_topology_test.dart || {
            echo "::error::Legacy ride_navigation_topology_test.dart must stay deleted."
            exit 1
          }

      - name: Keep journeys behavioral
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'readAsStringSync[[:space:]]*\(|readAsLinesSync[[:space:]]*\(' test/journeys --include='*.dart'; then
            echo "::error::Journey tests must exercise behavior, not read implementation source."
            exit 1
          fi

      - name: Cap legacy grep-style cases below 40
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          test_decl = re.compile(r'\btest(?:Widgets)?\s*\(')
          source_read = re.compile(r'readAsStringSync\s*\(|readAsLinesSync\s*\(')

          total = 0
          per_file = []
          for path in sorted(Path('test').rglob('*.dart')):
              text = path.read_text(encoding='utf-8')
              starts = [m.start() for m in test_decl.finditer(text)]
              count = 0
              for index, start in enumerate(starts):
                  end = starts[index + 1] if index + 1 < len(starts) else len(text)
                  if source_read.search(text[start:end]):
                      count += 1
              if count:
                  per_file.append((count, str(path)))
                  total += count

          print(f'Legacy grep-style test cases: {total}')
          for count, path in sorted(per_file, reverse=True):
              print(f'{count:3d} cases | {path}')

          if total >= 40:
              print(
                  f'::error::Phase 69 requires fewer than 40 legacy grep-style '
                  f'test cases; found {total}.'
              )
              sys.exit(1)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run real Rider journeys
        run: flutter test test/journeys
