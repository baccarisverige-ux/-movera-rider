name: Batch 5 Phase 69 Test Integrity

on:
  push:
    branches: [main]
    paths:
      - 'test/**'
      - '.github/workflows/batch5-phase69-test-integrity.yml'
  pull_request:
    paths:
      - 'test/**'
      - '.github/workflows/batch5-phase69-test-integrity.yml'
  workflow_dispatch:

jobs:
  journey-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the six real Rider journeys
        shell: bash
        run: |
          set -euo pipefail
          required=(
            test/journeys/book_to_home_test.dart
            test/journeys/catalog_failure_test.dart
            test/journeys/driver_cancel_research_test.dart
            test/journeys/reservation_journey_test.dart
            test/journeys/resume_mid_ride_test.dart
            test/journeys/rider_cancel_test.dart
          )
          for file in "${required[@]}"; do
            test -f "$file" || {
              echo "::error::Missing required Phase 69 journey: $file"
              exit 1
            }
          done

      - name: Reject the retired source-topology suite
        shell: bash
        run: |
          set -euo pipefail
          test ! -e test/ride/ride_navigation_topology_test.dart || {
            echo "::error::Legacy ride_navigation_topology_test.dart must stay deleted."
            exit 1
          }

      - name: Keep journeys behavioral
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'readAsStringSync[[:space:]]*\(|readAsLinesSync[[:space:]]*\(' test/journeys --include='*.dart'; then
            echo "::error::Journey tests must exercise behavior, not read implementation source."
            exit 1
          fi

      - name: Cap legacy grep-style cases below 40
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            grep -R -lE 'readAsStringSync[[:space:]]*\(|readAsLinesSync[[:space:]]*\('               test --include='*.dart' | sort || true
          )

          cases=0
          read_calls=0
          echo "Source-reading test files: ${#files[@]}"
          for file in "${files[@]}"; do
            file_cases="$(grep -cE '(^|[^A-Za-z0-9_])test(Widgets)?[[:space:]]*\(' "$file" || true)"
            file_reads="$(grep -cE 'readAsStringSync[[:space:]]*\(|readAsLinesSync[[:space:]]*\(' "$file" || true)"
            cases=$((cases + file_cases))
            read_calls=$((read_calls + file_reads))
            printf '%3d cases | %3d reads | %s\n' "$file_cases" "$file_reads" "$file"
          done

          echo "Legacy grep-style test cases: $cases"
          echo "Legacy source-reading call sites: $read_calls"
          if [ "$cases" -ge 40 ]; then
            echo "::error::Phase 69 requires fewer than 40 legacy grep-style test cases; found $cases."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run real Rider journeys
        run: flutter test test/journeys
