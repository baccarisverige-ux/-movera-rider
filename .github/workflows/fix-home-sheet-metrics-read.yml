name: Fix live Home sheet metrics read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-sheet-metrics-read.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Replace unsafe SheetController value reads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/rider/home/home.dart')
          s = p.read_text()
          old = '_homeSheetController.value'
          count = s.count(old)
          if count != 4:
              raise SystemExit(f'Expected exactly 4 Home SheetController.value reads, found {count}')
          s = s.replace(old, '_homeSheetController.metrics?.offset')
          p.write_text(s)
          print('Replaced all four Home sheet value reads with metrics?.offset.')
          PY

      - name: Format Home
        run: dart format 'lib/features/rider/home/home.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build repaired web app
        run: flutter build web --release --base-href '/-movera-rider/' --pwa-strategy=none

      - name: Verify safe metrics reads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('lib/features/rider/home/home.dart').read_text()
          if '_homeSheetController.value' in s:
              raise SystemExit('Unsafe SheetController.value read remains in Home')
          if s.count('_homeSheetController.metrics?.offset') != 4:
              raise SystemExit('Expected exactly four metrics?.offset reads in Home')
          print('All Home sheet reads use nullable metrics?.offset.')
          PY

      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'lib/features/rider/home/home.dart'
          git commit -m 'Read Home sheet offset from initialized metrics'
          git push origin HEAD:main
