name: Apply Rider Home Promo Carousel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-home-carousel.yml'

permissions:
  contents: write
  actions: write

jobs:
  update-home-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Comfort and Safety carousel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/rider/home/home.dart')
          text = path.read_text()
          start_marker = '  Widget _comfortRideCarousel() {'
          end_marker = '  Widget _pickupAddressField() {'

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Comfort carousel start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Pickup field marker not found')

          replacement = r'''  Widget _comfortRideCarousel() {
            final viewportWidth = MediaQuery.of(context).size.width;
            final cardWidth = (viewportWidth * 0.78).clamp(270.0, 330.0).toDouble();
            final imageHeight = ResSize.h * 112;
            final bandHeight = ResSize.h * 64;

            return SizedBox(
              height: imageHeight + bandHeight + ResSize.h * 2,
              width: double.infinity,
              child: ListView(
                scrollDirection: Axis.horizontal,
                physics: const BouncingScrollPhysics(),
                padding: EdgeInsets.only(right: ResSize.w * 8),
                children: [
                  _homePromoCard(
                    cardWidth: cardWidth,
                    imageHeight: imageHeight,
                    bandHeight: bandHeight,
                    imageAsset: 'assets/images/movera_comfort_ride.jpeg',
                    title: 'Movera Comfort',
                    subtitle: 'Extra space. Elevated comfort. A smoother way to ride.',
                    onTap: _handleDestinationTap,
                  ),
                  SizedBox(width: ResSize.w * 12),
                  _homePromoCard(
                    cardWidth: cardWidth,
                    imageHeight: imageHeight,
                    bandHeight: bandHeight,
                    imageAsset: 'assets/images/pin_verification.png',
                    title: 'Safety Toolkit',
                    subtitle: 'Essential safety tools, ready throughout every ride.',
                    onTap: () {},
                  ),
                  SizedBox(width: ResSize.w * 18),
                ],
              ),
            );
          }

          Widget _homePromoCard({
            required double cardWidth,
            required double imageHeight,
            required double bandHeight,
            required String imageAsset,
            required String title,
            required String subtitle,
            required VoidCallback onTap,
          }) {
            return SizedBox(
              width: cardWidth,
              child: Material(
                color: Colors.transparent,
                child: InkWell(
                  onTap: onTap,
                  borderRadius: BorderRadius.circular(22),
                  child: Container(
                    clipBehavior: Clip.antiAlias,
                    decoration: BoxDecoration(
                      color: AppColor.white,
                      borderRadius: BorderRadius.circular(22),
                      border: Border.all(color: _premiumLine, width: 0.8),
                      boxShadow: [
                        BoxShadow(
                          color: Colors.black.withOpacity(0.055),
                          blurRadius: 16,
                          offset: const Offset(0, 6),
                        ),
                      ],
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        SizedBox(
                          width: double.infinity,
                          height: imageHeight,
                          child: Image.asset(
                            imageAsset,
                            fit: BoxFit.cover,
                            alignment: Alignment.center,
                            filterQuality: FilterQuality.high,
                          ),
                        ),
                        Container(
                          width: double.infinity,
                          height: bandHeight,
                          color: AppColor.white,
                          padding: EdgeInsets.fromLTRB(
                            ResSize.w * 13,
                            ResSize.h * 8,
                            ResSize.w * 13,
                            ResSize.h * 7,
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              TextWidget(
                                text: title,
                                color: _premiumInk,
                                fontSize: 13.6,
                                fontWeight: fwBold,
                              ),
                              3.height,
                              TextWidget(
                                text: subtitle,
                                color: _premiumMuted,
                                fontSize: 9.2,
                                fontWeight: fwNormal,
                              ),
                            ],
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              ),
            );
          }
          '''

          updated = text[:start] + replacement + '\n' + text[end:]
          path.write_text(updated)
          PY

          git diff --check
          grep -q "title: 'Movera Comfort'" 'lib/features/rider/home/home.dart'
          grep -q "title: 'Safety Toolkit'" 'lib/features/rider/home/home.dart'
          grep -q "assets/images/pin_verification.png" 'lib/features/rider/home/home.dart'

      - name: Commit Rider carousel update
        shell: bash
        run: |
          rm -f .github/workflows/apply-home-carousel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'lib/features/rider/home/home.dart' .github/workflows/apply-home-carousel.yml
          git commit -m "Rebuild Rider home Comfort and Safety carousel"
          git push origin HEAD:main

      - name: Trigger Rider web publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-web-live.yml --ref main
