              "stylers": [{"visibility": "simplified"}]
            },
            {
              "featureType": "road",
              "elementType": "geometry",
              "stylers": [{"color": "#FFFFFF"}]
            },
            {
              "featureType": "road",
              "elementType": "geometry.stroke",
              "stylers": [{"color": "#D8DEE3"}, {"weight": 0.8}]
            },
            {
              "featureType": "road.highway",
              "elementType": "geometry",
              "stylers": [{"color": "#DDE5EC"}]
            },
            {
              "featureType": "road.highway",
              "elementType": "geometry.stroke",
              "stylers": [{"color": "#AEBECC"}, {"weight": 1.1}]
            },
            {
              "featureType": "road.arterial",
              "elementType": "geometry",
              "stylers": [{"color": "#F9FAFA"}]
            },
            {
              "featureType": "administrative",
              "elementType": "geometry.stroke",
              "stylers": [{"color": "#C9D2D8"}, {"weight": 0.7}]
            },
            {
              "featureType": "transit",
              "elementType": "geometry",
              "stylers": [{"color": "#E5E9EC"}]
            },
            {
              "featureType": "water",
              "elementType": "geometry",
              "stylers": [{"color": "#BDE3F0"}]
            },
            {
              "featureType": "water",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#607A83"}]
            }
          ]
          ''';

'''

          init_anchor = '  @override\n  void initState() {'
          if '_premiumMapStyle' not in source:
              source = source.replace(init_anchor, constants + init_anchor, 1)

          build_start = source.index('  @override\n  Widget build(BuildContext context) {')
          panel_marker = '\n  Widget panelColumn(ScrollController sc) {'
          build_end = source.index(panel_marker, build_start)

          new_build = r'''  @override
          Widget build(BuildContext context) {
            return Scaffold(
              drawer: const RiderSideMenu(),
              drawerScrimColor: Colors.black.withOpacity(0.38),
              body: Stack(
                children: [
                  SlidingUpPanel(
                    color: AppColor.white,
                    backdropColor: Colors.transparent,
                    margin: EdgeInsets.zero,
                    minHeight: ResSize.h * 215,
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withOpacity(0.10),
                        blurRadius: 28,
                        spreadRadius: 0,
                        offset: const Offset(0, -8),
                      ),
                    ],
                    isDraggable: true,
                    controller: _panelController,
                    defaultPanelState: PanelState.CLOSED,
                    maxHeight: ResSize.h * 480,
                    parallaxEnabled: false,
                    borderRadius: const BorderRadius.only(
                      topLeft: Radius.circular(28),
                      topRight: Radius.circular(28),
                    ),
                    panelBuilder: (ScrollController sc) => panelColumn(sc),
                    collapsed: InkWell(
                      onTap: () {
                        _panelController.open();
                      },
                      child: const SizedBox(height: 50, width: double.infinity),
                    ),
                    body: SizedBox(
                      height: MediaQuery.of(context).size.height,
                      width: double.infinity,
                      child: Stack(
                        children: [
                          CustomGoogleMap(
                            initialPosition: _initialPosition,
                            markers: _markers,
                            myLocationEnabled: true,
                            myLocationButtonEnabled: false,
                            zoomControlsEnabled: false,
                            mapToolbarEnabled: false,
                            compassEnabled: false,
                            trafficEnabled: false,
                            buildingsEnabled: true,
                            indoorViewEnabled: false,
                            mapType: MapType.normal,
                            customMapStyle: _premiumMapStyle,
                            onMapCreated: (GoogleMapController controller) {
                              _mapController = controller;
                            },
                            onTap: (LatLng position) {},
                          ),
                          Positioned.fill(
                            child: Padding(
                              padding: EdgeInsets.fromLTRB(
                                screenHorizPadding,
                                ResSize.h * 60,
                                screenHorizPadding,
                                0,
                              ),
                              child: Align(
                                alignment: Alignment.topCenter,
                                child: Row(
                                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                  children: [
                                    Builder(
                                      builder: (drawerContext) => _premiumFloatingButton(
                                        onTap: () {
                                          Scaffold.of(drawerContext).openDrawer();
                                        },
                                        child: Icon(
                                          Icons.menu_rounded,
                                          size: ResSize.h * 21,
                                          color: _premiumInk,
                                        ),
                                      ),
                                    ),
                                    _premiumFloatingButton(
                                      onTap: () {
                                        if (_panelController.isPanelOpen) {
                                          _panelController.close();
                                        }
                                        _profilePanelController.open();
                                      },
                                      child: Icon(
                                        Icons.person_outline_rounded,
                                        size: ResSize.h * 22,
                                        color: _premiumInk,
                                      ),
                                    ),
                                  ],
                                ),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                  RiderProfile(
                    controller: _profilePanelController,
                    onClose: () {
                      _profilePanelController.close();
                    },
                  ),
                ],
              ),
            );
          }

          Widget _premiumFloatingButton({
            required Widget child,
            required VoidCallback onTap,
          }) {
            return Material(
              color: Colors.transparent,
              child: InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(22),
                child: Container(
                  height: ResSize.h * 44,
                  width: ResSize.w * 44,
                  decoration: BoxDecoration(
                    color: AppColor.white.withOpacity(0.96),
                    shape: BoxShape.circle,
                    border: Border.all(color: _premiumLine, width: 0.8),
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withOpacity(0.10),
                        blurRadius: 18,
                        offset: const Offset(0, 5),
                      ),
                    ],
                  ),
                  alignment: Alignment.center,
                  child: child,
                ),
              ),
            );
          }
'''

          source = source[:build_start] + new_build + source[build_end:]

          panel_start = source.index('  Widget panelColumn(ScrollController sc) {')
          profile_marker = '\n  Widget profilePanelColumn(ScrollController sc) {'
          panel_end = source.index(profile_marker, panel_start)

          new_panel = r'''  Widget panelColumn(ScrollController sc) {
            return SingleChildScrollView(
              padding: EdgeInsets.fromLTRB(
                screenHorizPadding,
                ResSize.h * 10,
                screenHorizPadding,
                ResSize.h * 20,
