              controller: sc,
              physics: const BouncingScrollPhysics(),
              child: Column(
                children: [
                  Container(
                    width: ResSize.w * 38,
                    height: ResSize.h * 4,
                    decoration: BoxDecoration(
                      color: const Color(0xFFD6DBDE),
                      borderRadius: BorderRadius.circular(10),
                    ),
                  ),
                  10.height,
                  Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Expanded(
                        child: Row(
                          children: [
                            TextWidget(
                              text: "Plan now with ",
                              fontSize: 17,
                              fontWeight: fwVeryExtraBold,
                              color: _premiumInk,
                            ),
                            Flexible(
                              child: Image.asset(
                                AppAssets.logo,
                                height: ResSize.h * 21,
                              ),
                            ),
                          ],
                        ),
                      ),
                      InkWell(
                        onTap: () {
                          Navigator.push(
                            context,
                            BottomToTopTransition(const ScheduleRide()),
                          );
                        },
                        borderRadius: BorderRadius.circular(22),
                        child: Container(
                          height: ResSize.h * 38,
                          padding: EdgeInsets.symmetric(
                            horizontal: ResSize.w * 12,
                          ),
                          decoration: BoxDecoration(
                            borderRadius: BorderRadius.circular(22),
                            color: const Color(0xFFF3F4F5),
                            border: Border.all(color: _premiumLine, width: 0.8),
                          ),
                          child: Row(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Image.asset(
                                AppAssets.calendar,
                                height: ResSize.h * 17,
                                color: _premiumInk,
                              ),
                              7.width,
                              TextWidget(
                                text: "Later",
                                fontSize: 12.5,
                                fontWeight: fwMedium,
                                color: _premiumInk,
                              ),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                  12.height,
                  Row(
                    crossAxisAlignment: CrossAxisAlignment.center,
                    children: [
                      SizedBox(
                        height: ResSize.h * 126,
                        child: Column(
                          children: [
                            _routePoint(
                              child: Image.asset(
                                AppAssets.gps,
                                height: ResSize.h * 19,
                                color: const Color(0xFF365F57),
                              ),
                            ),
                            Expanded(
                              child: DottedLine(
                                dashLength: 3,
                                dashGapLength: 4,
                                lineThickness: 1.25,
                                dashRadius: 2,
                                dashColor: const Color(0xFF394248),
                                direction: Axis.vertical,
                              ),
                            ),
                            _routePoint(
                              child: Image.asset(
                                AppAssets.location,
                                height: ResSize.h * 19,
                                color: const Color(0xFF365F57),
                              ),
                            ),
                          ],
                        ),
                      ),
                      12.width,
                      Expanded(
                        child: Column(
                          children: [
                            _routeField(
                              onTap: () {
                                Navigator.push(
                                  context,
                                  BottomToTopTransition(ChooseRoute()),
                                );
                              },
                              text: "Central Park, DHA",
                            ),
                            12.height,
                            _routeField(
                              onTap: () {
                                Navigator.push(
                                  context,
                                  BottomToTopTransition(ChooseRoute()),
                                );
                              },
                              text: "Your destination",
                              trailing: Image.asset(
                                AppAssets.mic,
                                color: _premiumMuted,
                                height: ResSize.h * 20,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                  18.height,
                  const Divider(color: _premiumLine, thickness: 0.8, height: 0),
                  16.height,
                  Container(
                    padding: EdgeInsets.symmetric(
                      horizontal: ResSize.w * 12,
                      vertical: ResSize.h * 14,
                    ),
                    width: double.infinity,
                    decoration: BoxDecoration(
                      borderRadius: BorderRadius.circular(18),
                      color: const Color(0xFFF7F9FA),
                      border: Border.all(color: _premiumLine, width: 0.8),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        TextWidget(
                          text: "Your Last Trip",
                          color: _premiumInk,
                          fontSize: 16,
                          fontWeight: fwSemiBold,
                        ),
                        10.height,
                        ...List.generate(trips.length, (index) {
                          return Padding(
                            padding: EdgeInsets.only(
                              top: index == 0 ? 0 : ResSize.h * 7,
                            ),
                            child: Container(
                              padding: EdgeInsets.symmetric(
                                horizontal: ResSize.w * 11,
                                vertical: ResSize.h * 10,
                              ),
                              decoration: BoxDecoration(
                                color: AppColor.white,
                                borderRadius: BorderRadius.circular(14),
                                border: Border.all(
                                  color: _premiumLine,
                                  width: 0.8,
                                ),
                              ),
                              child: Row(
                                children: [
                                  Container(
                                    height: ResSize.h * 36,
                                    width: ResSize.w * 36,
                                    decoration: BoxDecoration(
                                      color: const Color(0xFFF3F6F5),
                                      borderRadius: BorderRadius.circular(11),
                                    ),
                                    alignment: Alignment.center,
                                    child: Image.asset(
                                      AppAssets.location,
                                      color: const Color(0xFF365F57),
                                      height: ResSize.h * 20,
                                    ),
                                  ),
                                  11.width,
                                  Expanded(
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        TextWidget(
                                          text: "30 Main Street",
                                          color: _premiumInk,
                                          fontSize: 12,
                                          fontWeight: fwSemiBold,
                                        ),
                                        3.height,
                                        TextWidget(
                                          text: "5.9km|30 Main Street, London",
                                          color: _premiumMuted,
                                          fontSize: 10,
                                          fontWeight: fwNormal,
                                        ),
                                      ],
                                    ),
                                  ),
                                  InkWell(
                                    onTap: () {
                                      setState(() {
                                        trips[index] = !trips[index];
                                      });
                                    },
                                    borderRadius: BorderRadius.circular(20),
                                    child: Padding(
                                      padding: const EdgeInsets.all(4),
                                      child: trips[index]
                                          ? Image.asset(
                                              AppAssets.starFill,
                                              height: ResSize.h * 21,
                                            )
                                          : Image.asset(
                                              AppAssets.star,
                                              color: const Color(0xFF365F57),
                                              height: ResSize.h * 21,
                                            ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          );
                        }),
                      ],
                    ),
                  ),
                ],
              ),
            );
          }

          Widget _routePoint({required Widget child}) {
            return Container(
              height: ResSize.h * 38,
              width: ResSize.w * 38,
              decoration: BoxDecoration(
                shape: BoxShape.circle,
                color: const Color(0xFFF6F8F8),
                border: Border.all(color: _premiumLine, width: 0.8),
              ),
              alignment: Alignment.center,
              child: child,
            );
          }

          Widget _routeField({
            required VoidCallback onTap,
            required String text,
            Widget? trailing,
          }) {
            return Material(
              color: Colors.transparent,
              child: InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(15),
                child: Container(
                  height: ResSize.h * 57,
                  width: double.infinity,
                  padding: EdgeInsets.symmetric(horizontal: ResSize.w * 16),
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(15),
                    color: _premiumField,
                    border: Border.all(
                      color: const Color(0xFFECEAE5),
                      width: 0.8,
                    ),
                  ),
                  child: Row(
                    children: [
                      Expanded(
                        child: TextWidget(
                          fontSize: 16,
                          fontWeight: fwNormal,
                          text: text,
                          color: _premiumMuted,
                        ),
                      ),
                      if (trailing != null) trailing,
                    ],
                  ),
                ),
              ),
            );
          }
'''

          source = source[:panel_start] + new_panel + source[panel_end:]
          path.write_text(source)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --pwa-strategy=none

      - name: Commit validated redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/rider/home/home.dart
          git commit -m "Polish Rider map home screen" || exit 0
          git push origin HEAD:main
