name: Apply Rider Premium Map Redesign

on:
  push:
    paths:
      - '.github/workflows/premium-map-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply premium map screen design
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/rider/home/home.dart')
          source = path.read_text()

          constants = r'''  static const Color _premiumInk = Color(0xFF1D252C);
          static const Color _premiumMuted = Color(0xFF778189);
          static const Color _premiumLine = Color(0xFFE7EBEE);
          static const Color _premiumField = Color(0xFFF6F5F1);

          static const String _premiumMapStyle = '''
          [
            {
              "featureType": "all",
              "elementType": "labels.text.fill",
              "stylers": [{"color": "#4F565C"}]
            },
            {
              "featureType": "all",
              "elementType": "labels.text.stroke",
              "stylers": [{"color": "#FAF8F2"}, {"weight": 2}]
            },
            {
              "featureType": "landscape",
              "elementType": "geometry",
              "stylers": [{"color": "#F4F0E5"}]
            },
            {
              "featureType": "landscape.natural",
              "elementType": "geometry",
              "stylers": [{"color": "#E8EEDB"}]
            },
            {
              "featureType": "poi",
              "elementType": "geometry",
              "stylers": [{"color": "#E9EBDD"}]
            },
            {
              "featureType": "poi.park",
              "elementType": "geometry",
              "stylers": [{"color": "#D4ECC3"}]
            },
            {
