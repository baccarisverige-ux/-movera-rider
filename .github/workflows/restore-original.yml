name: Restore Original ZIP Fidelity

on:
  push:
    paths:
      - '.github/workflows/restore-original.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get counterpart source
        run: git clone --depth 1 https://github.com/baccarisverige-ux/-movera-driver.git /tmp/other
      - name: Reconstruct exact original ZIP app
        env:
          VARIANT: rider
        run: python tools/restore_original_zip.py
      - name: Commit faithful Rider source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original riding_app ZIP for Rider"
          git push
# retry-2
