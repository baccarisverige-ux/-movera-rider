name: Fix categories display

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_categories_display.py'
      - '.github/workflows/fix-categories-display.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch categories navigation
        run: python3 .github/scripts/fix_categories_display.py

      - name: Format Home
        run: dart format 'lib/features/rider/home/home.dart'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze repaired flow
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build repaired web app
        run: flutter build web --release --base-href '/-movera-rider/' --pwa-strategy=none

      - name: Verify plain categories route
        run: |
          grep -n "builder: (_) => SelectRide" 'lib/features/rider/home/home.dart'
          if grep -A15 -B3 "SelectRide(" 'lib/features/rider/home/home.dart' | grep -q "BottomToTopTransition"; then
            echo 'SelectRide still uses legacy custom transition.'
            exit 1
          fi

      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'lib/features/rider/home/home.dart'
          git commit -m 'Make categories navigation deterministic'
          git push origin HEAD:main
