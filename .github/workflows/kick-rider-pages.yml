name: Kick Rider Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-rider-pages.yml'

permissions:
  contents: write
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/kick-rider-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/kick-rider-pages.yml
          git commit -m "Remove Rider Pages kick workflow"
          git push origin HEAD:main

      - name: Publish latest Rider main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-web-live.yml --ref main
