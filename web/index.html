<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="movera">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Movera Rider</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.moveraReverseGeocode = function(latitude, longitude) {
      return new Promise(function(resolve) {
        if (!window.google || !google.maps || !google.maps.Geocoder) {
          resolve(null);
          return;
        }
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode(
          { location: { lat: Number(latitude), lng: Number(longitude) } },
          function(results, status) {
            resolve(
              status === 'OK' && results && results.length
                ? results[0].formatted_address
                : null
            );
          }
        );
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
