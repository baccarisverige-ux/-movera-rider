<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="movera">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Movera Rider</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.moveraReverseGeocode = function(latitude, longitude) {
      return new Promise(function(resolve) {
        if (!window.google || !google.maps || !google.maps.Geocoder) {
          resolve(null);
          return;
        }
        new google.maps.Geocoder().geocode(
          { location: { lat: latitude, lng: longitude } },
          function(results, status) {
            resolve(
              status === 'OK' && results && results[0]
                ? results[0].formatted_address
                : null
            );
          }
        );
      });
    };

    window.moveraDeviceHeading = null;
    window.moveraHeadingStarted = false;
    window.moveraStartHeading = async function() {
      try {
        if (window.moveraHeadingStarted) return true;
        if (typeof DeviceOrientationEvent === 'undefined') return false;
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          var permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') return false;
        }
        var updateHeading = function(event) {
          var value = event.webkitCompassHeading;
          if (typeof value !== 'number' && typeof event.alpha === 'number') {
            value = (360 - event.alpha) % 360;
            var screenAngle = 0;
            if (screen.orientation && typeof screen.orientation.angle === 'number') {
              screenAngle = screen.orientation.angle;
            } else if (typeof window.orientation === 'number') {
              screenAngle = window.orientation;
            }
            value = (value + screenAngle + 360) % 360;
          }
          if (typeof value === 'number' && isFinite(value)) {
            window.moveraDeviceHeading = (value + 360) % 360;
          }
        };
        window.addEventListener('deviceorientationabsolute', updateHeading, true);
        window.addEventListener('deviceorientation', updateHeading, true);
        window.moveraHeadingStarted = true;
        return true;
      } catch (_) {
        return false;
      }
    };

    window.moveraGeocodeAddress = function(address) {
      return new Promise(function(resolve) {
        if (!window.google || !google.maps || !google.maps.Geocoder) {
          resolve(null);
          return;
        }
        new google.maps.Geocoder().geocode(
          { address: address },
          function(results, status) {
            if (status !== 'OK' || !results || !results[0]) {
              resolve(null);
              return;
            }
            var location = results[0].geometry.location;
            resolve(JSON.stringify({
              address: results[0].formatted_address,
              latitude: location.lat(),
              longitude: location.lng()
            }));
          }
        );
      });
    };
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
