<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Movera — premium rides in Sweden.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11181D">
  <meta name="color-scheme" content="light">

  <!-- iOS full-screen home screen app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Movera">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Movera</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #11181D;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body>
  <script>
    // Old Flutter builds used a service worker on this same GitHub Pages scope.
    // Remove any surviving worker/cache before booting the current non-PWA app.
    (function() {
      var resetKey = 'movera-web-cache-reset:' + location.pathname + location.search;
      var resetNeeded = false;
      var tasks = [];

      if ('serviceWorker' in navigator) {
        tasks.push(
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            if (registrations.length) resetNeeded = true;
            return Promise.all(registrations.map(function(registration) {
              return registration.unregister();
            }));
          })
        );
      }

      if ('caches' in window) {
        tasks.push(
          caches.keys().then(function(keys) {
            if (keys.length) resetNeeded = true;
            return Promise.all(keys.map(function(key) {
              return caches.delete(key);
            }));
          })
        );
      }

      Promise.all(tasks).then(function() {
        if (resetNeeded && !sessionStorage.getItem(resetKey)) {
          sessionStorage.setItem(resetKey, '1');
          location.reload();
        }
      }).catch(function() {
        // Cache cleanup must never prevent the Rider app from starting.
      });
    })();

    // Address lookup is intentionally independent from the Google Maps JS
    // Geocoder. The production Maps key renders the map but is currently not
    // authorised for Google's Geocoding service. Calling that service caused
    // address confirmation to fail on the live Rider site. Keep a small
    // in-memory cache and use the OpenStreetMap Nominatim endpoint instead.
    window.moveraGeoCache = window.moveraGeoCache || new Map();

    window.moveraFetchJson = async function(url) {
      var controller = new AbortController();
      var timer = setTimeout(function() { controller.abort(); }, 8000);
      try {
        var response = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          cache: 'force-cache',
          signal: controller.signal,
          headers: { 'Accept': 'application/json' }
        });
        if (!response.ok) return null;
        return await response.json();
      } catch (_) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    };

    window.moveraReverseGeocode = async function(latitude, longitude) {
      var key = 'reverse:' + Number(latitude).toFixed(5) + ':' + Number(longitude).toFixed(5);
      if (window.moveraGeoCache.has(key)) return window.moveraGeoCache.get(key);
      var url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=0&accept-language=en&lat=' +
        encodeURIComponent(latitude) + '&lon=' + encodeURIComponent(longitude);
      var data = await window.moveraFetchJson(url);
      var value = data && data.display_name ? String(data.display_name) : null;
      if (value) window.moveraGeoCache.set(key, value);
      return value;
    };

    window.moveraDeviceHeading = null;
    window.moveraHeadingStarted = false;
    window.moveraHeadingStartPromise = null;
    window.moveraHeadingListenerCount = 0;
    window.moveraHeadingPermission = 'auto';
    window._moveraSawAbsolute = false;
    window._moveraHeadingArmed = false;
    window._moveraGestureAsked = false;

    window.moveraWrapHeading = function(value) {
      var heading = Number(value) % 360;
      if (heading < 0) heading += 360;
      return heading;
    };

    window.moveraScreenAngle = function() {
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        return screen.orientation.angle;
      }
      if (typeof window.orientation === 'number') return window.orientation;
      return 0;
    };

    window.moveraHeadingFromEvent = function(event) {
      var heading = null;
      if (typeof event.webkitCompassHeading === 'number' && isFinite(event.webkitCompassHeading)) {
        heading = event.webkitCompassHeading;
      } else if (typeof event.alpha === 'number' && isFinite(event.alpha)) {
        heading = 360 - event.alpha;
      }
      if (heading == null || !isFinite(heading)) return null;
      return window.moveraWrapHeading(heading + window.moveraScreenAngle());
    };

    window._moveraOnOrientation = function(event) {
      if (!event) return;
      if (event.type === 'deviceorientationabsolute') {
        window._moveraSawAbsolute = true;
      } else if (window._moveraSawAbsolute && event.type === 'deviceorientation') {
        return;
      }
      var heading = window.moveraHeadingFromEvent(event);
      if (heading == null) return;
      window.moveraDeviceHeading = heading;
    };

    window.moveraAttachHeadingListeners = function() {
      window.removeEventListener('deviceorientationabsolute', window._moveraOnOrientation, true);
      window.removeEventListener('deviceorientation', window._moveraOnOrientation, true);
      window.addEventListener('deviceorientationabsolute', window._moveraOnOrientation, true);
      window.addEventListener('deviceorientation', window._moveraOnOrientation, true);
      window.moveraHeadingListenerCount = 2;
    };

    window.moveraStopHeading = function() {
      if (window._moveraOnOrientation) {
        window.removeEventListener('deviceorientationabsolute', window._moveraOnOrientation, true);
        window.removeEventListener('deviceorientation', window._moveraOnOrientation, true);
      }
      window.moveraHeadingStarted = false;
      window.moveraHeadingStartPromise = null;
      window.moveraHeadingListenerCount = 0;
      window._moveraSawAbsolute = false;
    };

    window.moveraInjectHeading = function(deg) {
      var value = Number(deg);
      if (!Number.isFinite(value)) return null;
      window.moveraDeviceHeading = window.moveraWrapHeading(value);
      return window.moveraDeviceHeading;
    };

    window.moveraNeedsOrientationPermission = function() {
      return typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function';
    };

    // iOS requires requestPermission() to be invoked synchronously from a
    // real browser gesture. Flutter canvas taps are not trusted, so this is
    // armed on capture-phase pointer/touch/click.
    window.moveraRequestHeadingFromGesture = function() {
      if (window.moveraHeadingStarted || window._moveraGestureAsked) return;
      window._moveraGestureAsked = true;
      try {
        if (window.moveraNeedsOrientationPermission()) {
          DeviceOrientationEvent.requestPermission().then(function(permission) {
            if (permission === 'granted') {
              window.moveraHeadingPermission = 'granted';
              window.moveraAttachHeadingListeners();
              window.moveraHeadingStarted = true;
            } else {
              window.moveraHeadingPermission = 'denied';
            }
          }).catch(function() {
            window.moveraHeadingPermission = 'denied';
          });
          return;
        }
      } catch (_) {}
      window.moveraStartHeading({fromGesture: true});
    };

    window.moveraStartHeading = async function(opts) {
      var fromGesture = !!(opts && opts.fromGesture);
      if (window.moveraHeadingStarted) return true;
      if (window.moveraHeadingPermission === 'denied') return false;
      if (window.moveraNeedsOrientationPermission() &&
          !fromGesture &&
          window.moveraHeadingPermission !== 'granted') {
        // Do not call requestPermission outside a user gesture. Dart/Home
        // startup would steal the iPhone prompt and fail.
        return false;
      }
      if (window.moveraHeadingStartPromise) return window.moveraHeadingStartPromise;
      window.moveraHeadingStartPromise = (async function() {
        try {
          if (typeof DeviceOrientationEvent === 'undefined' &&
              window.moveraHeadingPermission !== 'granted') {
            return false;
          }
          if (window.moveraHeadingPermission === 'denied') return false;
          if (window.moveraNeedsOrientationPermission() &&
              window.moveraHeadingPermission !== 'granted') {
            var permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') return false;
            window.moveraHeadingPermission = 'granted';
          }
          window.moveraAttachHeadingListeners();
          window.moveraHeadingStarted = true;
          return true;
        } catch (_) {
          return false;
        }
      })();
      var started = await window.moveraHeadingStartPromise;
      if (!started) window.moveraHeadingStartPromise = null;
      return started;
    };

    window.moveraArmHeadingFromGesture = function() {
      if (window._moveraHeadingArmed) return;
      window._moveraHeadingArmed = true;
      var arm = function() {
        window.removeEventListener('pointerdown', arm, true);
        window.removeEventListener('touchstart', arm, true);
        window.removeEventListener('touchend', arm, true);
        window.removeEventListener('click', arm, true);
        window.moveraRequestHeadingFromGesture();
      };
      window.addEventListener('pointerdown', arm, true);
      window.addEventListener('touchstart', arm, true);
      window.addEventListener('touchend', arm, true);
      window.addEventListener('click', arm, true);
    };
    window.moveraArmHeadingFromGesture();
    window.addEventListener('pagehide', function() {
      window.moveraStopHeading();
    });

    window.moveraGeocodeAddress = async function(address) {
      var clean = String(address || '').trim();
      if (!clean) return null;
      var key = 'search:' + clean.toLowerCase();
      if (window.moveraGeoCache.has(key)) return window.moveraGeoCache.get(key);
      var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=0&accept-language=en&q=' +
        encodeURIComponent(clean);
      var data = await window.moveraFetchJson(url);
      if (!Array.isArray(data) || !data.length) return null;
      var first = data[0];
      var latitude = Number(first.lat);
      var longitude = Number(first.lon);
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;
      var result = JSON.stringify({
        address: first.display_name ? String(first.display_name) : clean,
        latitude: latitude,
        longitude: longitude
      });
      window.moveraGeoCache.set(key, result);
      return result;
    };
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
